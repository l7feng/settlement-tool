<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>制作结算台</title>
<script src="assets/desktop-workspace.js"></script>
<script src="assets/version.js"></script>
<script src="assets/billing-core.js"></script>
<style>
  :root{
    --bg:#0f1115; --panel:rgba(255,255,255,.045); --line:rgba(255,255,255,.10);
    --sub:#9aa3af; --text:#e8ecf1; --blue:#4c8dff; --blue-dim:rgba(76,141,255,.16);
    --ok:#3fb950; --warn:#ff9f5c; --danger:#ff6b6b;
    --font:"Microsoft YaHei UI","Segoe UI",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:radial-gradient(1200px 700px at 12% -10%,rgba(76,141,255,.13),transparent 60%),radial-gradient(900px 600px at 92% 0, rgba(255,159,92,.08),transparent 60%),var(--bg);color:var(--text);font:14px/1.5 var(--font);font-variant-numeric:tabular-nums;display:flex;flex-direction:column;overflow:hidden}
  button{font:inherit;cursor:pointer}
  .top{height:58px;flex:0 0 58px;display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.02));overflow-x:auto;overflow-y:hidden}
  .brand{display:flex;align-items:baseline;gap:10px;min-width:196px;flex:0 0 auto}
  .brand .mark{font:700 9.5px/1.15 "Segoe UI";letter-spacing:1.5px;color:#fff;background:var(--blue);border-radius:6px;padding:5px 7px;text-align:left}
  .brand .cn{font-size:17px;font-weight:650;letter-spacing:.5px;white-space:nowrap}
  .top .spacer{flex:1}
  .btn{height:30px;padding:0 11px;border-radius:8px;border:1px solid var(--line);background:rgba(255,255,255,.055);color:var(--text);font-size:12.5px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;flex:0 0 auto}
  .btn:hover{background:rgba(255,255,255,.10)}
  .btn.ghost{background:transparent}
  .btn.primary{background:var(--blue);border-color:transparent;color:#fff;font-weight:600}
  .btn.primary:hover{filter:brightness(1.08)}
  .btn.sm{height:26px;font-size:12px}
  .btn.icon{width:28px;padding:0;justify-content:center}
  .select,input[type=month],input[type=date]{height:30px;padding:0 10px;border-radius:8px;border:1px solid var(--line);background:rgba(255,255,255,.055);color:var(--text);font-size:12.5px;min-width:96px}
  .select{appearance:none;padding-right:26px;background-image:linear-gradient(45deg,transparent 50%,var(--sub) 50%),linear-gradient(135deg,var(--sub) 50%,transparent 50%);background-position:calc(100% - 15px) 13px,calc(100% - 10px) 13px;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
  .ledger{display:flex;align-items:center;gap:8px;padding:3px 8px 3px 3px;border-radius:9px;border:1px solid var(--line);background:rgba(255,255,255,.04);flex:0 0 auto;max-width:280px}
  .ledger .dot{width:6px;height:6px;border-radius:50%;background:var(--ok);margin-left:6px;flex:0 0 auto}
  .ledger .name{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ledger .menu{color:var(--sub);font-size:11px;padding:0 2px;background:none;border:0;white-space:nowrap}
  .body{flex:1;display:grid;grid-template-columns:184px minmax(0,1fr) 236px;min-height:0}
  @media (max-width:1100px){.body{grid-template-columns:150px minmax(0,1fr) 200px}.nav{padding:8px}.side{padding:9px}}
  .nav{border-right:1px solid var(--line);padding:10px 10px;background:rgba(255,255,255,.02);overflow:auto}
  .nav .grp{font-size:10.5px;letter-spacing:1.2px;color:#6f7883;margin:13px 0 5px 6px}
  .nav .it{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:9px;font-size:13px;color:#c9d0d8;margin-bottom:2px;border:0;background:none;width:100%;text-align:left}
  .nav .it:hover{background:rgba(255,255,255,.05)}
  .nav .it i{width:5px;height:5px;border-radius:2px;background:#5c6673;flex:0 0 auto}
  .nav .it.on{background:var(--blue-dim);color:#fff;font-weight:600}
  .nav .it.on i{background:var(--blue)}
  .nav .it .k{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .nav .it .n{font-size:10.5px;color:#7d868f;flex:0 0 auto}
  .main{padding:10px 14px;display:flex;flex-direction:column;gap:9px;min-width:0;min-height:0;overflow-y:auto;overflow-x:hidden}
  .chips{display:flex;align-items:center;gap:8px;min-height:28px;flex-wrap:wrap}
  .chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 4px 0 10px;border-radius:999px;border:1px solid rgba(76,141,255,.38);background:var(--blue-dim);font-size:12px;color:#dbe7ff}
  .chip b{font-weight:600}
  .chip .x{width:16px;height:16px;border-radius:50%;display:grid;place-items:center;color:#9fb6de;font-size:11px;border:0;background:none;padding:0}
  .chip .x:hover{background:rgba(255,255,255,.1);color:#fff}
  .chips .clr{font-size:12px;color:#7f8a97;border:0;background:none;padding:2px 4px}
  .chips .clr:hover{color:#c9d3e0}
  .chips .spacer{flex:1}
  .chips .scope{font-size:12px;color:var(--sub);white-space:nowrap}
  .chips .scope b{color:#e8ecf1;font-weight:600}
  .kpis{display:grid;grid-template-columns:1fr 1fr 1.25fr;gap:9px;flex:0 0 auto}
  .kpi{border:1px solid var(--line);border-radius:14px;padding:8px 14px;background:var(--panel);display:flex;flex-direction:column;justify-content:center;height:84px;min-width:0}
  .kpi .l{font-size:11.5px;color:var(--sub);display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .kpi .v{font-size:22px;font-weight:700;letter-spacing:-.3px;margin-top:0;white-space:nowrap;line-height:1.35}
  .kpi .v .u{font-size:12px;font-weight:500;color:var(--sub);margin-left:5px}
  .kpi .foot{font-size:10.5px;color:#7f8a97;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .eye{width:22px;height:22px;border-radius:7px;border:1px solid var(--line);display:grid;place-items:center;color:#9aa3af;font-size:11px;background:rgba(255,255,255,.05);padding:0;flex:0 0 auto}
  .drop{height:36px;flex:0 0 36px;border:1px dashed rgba(255,255,255,.20);border-radius:11px;display:flex;align-items:center;gap:10px;padding:0 12px;background:rgba(255,255,255,.028)}
  .drop .hint{font-size:12.5px;color:#8f99a4;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .drop .btn{height:26px;font-size:12px}
  .cal{border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:7px 11px 9px;flex:0 0 auto}
  .cal .head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
  .cal .head .t{font-size:13px;font-weight:650;white-space:nowrap}
  .cal .head .meta{font-size:11.5px;color:#7f8a97;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cal .head .spacer{flex:1;min-width:0}
  .cal .head .btn{height:24px;font-size:11.5px}
  @media (max-width:1100px){.cal .head .meta{display:none}}
  .days{display:flex;flex-wrap:wrap;gap:2px;padding:5px 6px;border-radius:11px;background:rgba(0,0,0,.18);box-shadow:inset 0 0 0 1px rgba(255,255,255,.055)}
  .days.collapsed{display:none}
  .d{flex:1 1 24px;min-width:24px;height:26px;border:0;background:none;border-radius:6px;position:relative;display:grid;place-items:center;font-size:11.5px;color:#5f6a76;padding:0;line-height:1;transition:background .12s,color .12s}
  .d:hover{background:rgba(255,255,255,.055);color:#c9d3e0}
  .d.has{color:#cfe0ff;font-weight:600}
  .d.has::after{content:'';position:absolute;left:50%;bottom:2px;width:4px;height:4px;border-radius:50%;background:rgba(76,141,255,.85);transform:translateX(-50%)}
  .d.today{color:#ffbd8f;font-weight:700}
  .d.today::before{content:'';position:absolute;inset:1px 4px;border:1px solid rgba(255,159,92,.35);border-radius:5px}
  .d.on{background:rgba(76,141,255,.24);color:#fff;box-shadow:inset 0 0 0 1px rgba(76,141,255,.55)}
  .modal.modal-wide{width:min(980px,95vw)}
  .hm-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--sub)}
  .hm-head .spacer{flex:1}
  .hm-seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .hm-seg button{height:25px;padding:0 11px;font-size:11.5px;background:none;border:0;color:#9aa3af;cursor:pointer}
  .hm-seg button.on{background:rgba(76,141,255,.18);color:#e8f0ff}
  .hm-chart{overflow-x:auto;padding:2px 0 3px}
  .hm-inner{min-width:828px}
  .hm-months{display:grid;gap:3px;margin-left:21px;margin-bottom:5px;font-size:9.5px;color:#7f8a97}
  .hm-months span{white-space:nowrap;overflow:visible}
  .hm-body{display:flex;gap:5px}
  .hm-wd{display:grid;grid-template-rows:repeat(7,12px);gap:3px;font-size:9.5px;color:#66707c;width:16px;text-align:right}
  .hm-wd span{line-height:12px}
  .hm-grid{display:flex;gap:3px}
  .hm-col{display:grid;grid-template-rows:repeat(7,12px);gap:3px}
  .hm-cell{width:12px;height:12px;border-radius:2.5px;border:0;padding:0;background:#1b232d;cursor:pointer}
  .hm-cell.lv1{background:#1e3b5c}
  .hm-cell.lv2{background:#275d92}
  .hm-cell.lv3{background:#347fc9}
  .hm-cell.lv4{background:#66aef0}
  .hm-cell.today{box-shadow:0 0 0 1px #ffbd8f}
  .hm-cell:hover{box-shadow:0 0 0 1px #fff}
  .hm-cell.blank{background:transparent;cursor:default;pointer-events:none}
  .hm-legend{display:flex;align-items:center;gap:4px;font-size:10px;color:#7f8a97}
  .hm-legend i{width:12px;height:12px;border-radius:2.5px;display:inline-block}
  .hm-legend i.lv1{background:#1e3b5c}.hm-legend i.lv2{background:#275d92}.hm-legend i.lv3{background:#347fc9}.hm-legend i.lv4{background:#66aef0}
  .hm-stats{display:flex;gap:20px;flex-wrap:wrap;font-size:11.5px;color:#8f99a4;border-top:1px solid var(--line);padding-top:9px;margin-top:3px}
  .hm-stats b{color:#e8ecf1}
  body.light .hm-cell{background:#ebeef2}
  body.light .hm-cell.lv1{background:#d6e6fb}
  body.light .hm-cell.lv2{background:#a8cbf5}
  body.light .hm-cell.lv3{background:#5d9ee8}
  body.light .hm-cell.lv4{background:#1f6fc4}
  body.light .hm-legend i.lv1{background:#d6e6fb}body.light .hm-legend i.lv2{background:#a8cbf5}body.light .hm-legend i.lv3{background:#5d9ee8}body.light .hm-legend i.lv4{background:#1f6fc4}
  .table{flex:1 1 auto;border:1px solid var(--line);border-radius:14px;background:var(--panel);overflow:hidden;display:flex;flex-direction:column;min-height:280px}
  .tscroll{flex:1;min-height:0;overflow:auto}
  .thead{display:grid;grid-template-columns:minmax(190px,250px) 74px 96px 84px 66px 86px 96px minmax(96px,1fr);padding:7px 14px;font-size:11.5px;color:#7f8a97;border-bottom:1px solid var(--line);gap:4px;min-width:820px;position:sticky;top:0;z-index:4;background:#141821}
  body.light .thead{background:#fff}
  .thead button{display:flex;align-items:center;gap:4px;background:none;border:0;color:inherit;font:inherit;padding:0;text-align:left}
  .thead span:last-child,.thead button:last-child{justify-self:end}
  .thead .arrow{font-size:9px;color:#5f6b78}
  .thead .active{color:#cfd6de}
  .tbody{overflow:visible;min-height:0}
  .grp-row{display:flex;align-items:center;gap:9px;padding:6px 14px;font-size:12px;background:rgba(255,255,255,.035);border-bottom:1px solid rgba(255,255,255,.05);position:sticky;top:31px;z-index:3;backdrop-filter:blur(4px);min-width:820px}
  .grp-row .caret{color:#7f8a97;font-size:10px;border:0;background:none;padding:0;width:14px}
  .grp-row .nm{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40%}
  .grp-row .sum{color:#8f99a4;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .grp-row .fee{margin-left:auto;font-weight:650;color:#e8ecf1;white-space:nowrap}
  .row{display:grid;grid-template-columns:minmax(190px,250px) 74px 96px 84px 66px 86px 96px minmax(96px,1fr);align-items:center;padding:6px 14px;border-bottom:1px solid rgba(255,255,255,.045);font-size:12.5px;gap:4px;cursor:pointer}
  .row:hover{background:rgba(255,255,255,.035)}
  .row.sel{background:rgba(76,141,255,.10)}
  .row .ep{padding-left:18px;color:#cfd6de;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .ep .tag{font-size:10px;padding:1px 5px;border-radius:5px;border:1px solid var(--line);color:#9aa3af;margin-left:6px}
  .row .fee{text-align:right;font-weight:650;white-space:nowrap}
  .row .date,.row .dur,.row .grade,.row .type,.row .price{color:#cfd6de;white-space:nowrap}
  .row.empty{padding:16px 14px;display:block;color:#7f8a97;font-size:12.5px;min-width:820px}
  .tag{display:inline-block;font-size:10px;padding:1px 6px;border-radius:5px;border:1px solid var(--line);color:#9aa3af;white-space:nowrap}
  .tag.auto{border-color:rgba(76,141,255,.4);color:#9dbcf5;background:rgba(76,141,255,.10)}
  .tag.g{border-color:rgba(63,185,80,.35);color:#7bd189;background:rgba(63,185,80,.10)}
  .tag.m{border-color:rgba(255,159,92,.35);color:#ffb27a;background:rgba(255,159,92,.10)}
  .total{display:flex;align-items:center;gap:12px;padding:8px 14px;font-size:12px;color:#8f99a4;border-top:1px solid var(--line);flex:0 0 auto;background:rgba(0,0,0,.20);flex-wrap:wrap}
  .total b{color:#e8ecf1;font-weight:650}
  .total .spacer{flex:1}
  .side{border-left:1px solid var(--line);padding:11px;display:flex;flex-direction:column;gap:9px;background:rgba(255,255,255,.02);overflow:auto}
  .side .hd{display:flex;align-items:center;gap:8px}
  .side .hd .t{font-size:12.5px;font-weight:650;letter-spacing:.3px}
  .side .hd .spacer{flex:1}
  .side .hd .btn{height:24px;font-size:11px}
  .field{display:flex;flex-direction:column;gap:4px}
  .field label{font-size:10.5px;color:#7f8a97;letter-spacing:.4px}
  .field .select,.field input{width:100%;height:29px;font-size:12px}
  .field input[type=search]{border:1px solid var(--line);border-radius:8px;background:rgba(255,255,255,.05);color:var(--text);padding:0 10px}
  .more{height:29px;border-radius:8px;border:1px solid var(--line);background:rgba(255,255,255,.035);display:flex;align-items:center;padding:0 10px;font-size:11.5px;color:#aab3bd;gap:6px;width:100%}
  .more .n{font-size:10px;color:#8f99a4;border:1px solid var(--line);border-radius:5px;padding:0 5px}
  .more .spacer{flex:1}
  .more-panel{display:none;flex-direction:column;gap:8px;border:1px solid var(--line);border-radius:10px;padding:9px;background:rgba(0,0,0,.18)}
  .more-panel.open{display:flex}
  .side .hintbox{border:1px solid var(--line);border-radius:11px;padding:10px;font-size:11.5px;color:#7f8a97;background:rgba(255,255,255,.025);line-height:1.7}
  .side .active{margin-top:auto;border-top:1px solid var(--line);padding-top:8px;display:flex;align-items:center;font-size:11.5px;color:#8f99a4;gap:4px}
  .side .active b{color:#e8ecf1;margin:0 2px}
  .side .active .clr{margin-left:auto;color:#9dbcf5;border:0;background:none;padding:0}
  .status{height:26px;flex:0 0 26px;display:flex;align-items:center;gap:10px;padding:0 14px;font-size:11px;color:#6f7883;border-top:1px solid var(--line);background:rgba(0,0,0,.25);overflow:hidden}
  .status .spacer{flex:1}
  .status .undo{color:#9dbcf5;border:0;background:none;padding:0}
  .status .undo[disabled]{color:#4f5965;cursor:default}
  .modal-back{position:fixed;inset:0;background:rgba(0,0,0,.62);display:grid;place-items:center;z-index:50;padding:20px}
  .modal{width:min(720px,92vw);max-height:86vh;overflow:auto;background:#171b22;border:1px solid var(--line);border-radius:14px;box-shadow:0 20px 60px #0008}
  .modal .mh{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#171b22;z-index:2}
  .modal .mh .t{font-weight:650;font-size:14px}
  .modal .mh .spacer{flex:1}
  .modal .mb{padding:14px 16px;display:grid;gap:11px}
  .modal .mf{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:9px;justify-content:flex-end;position:sticky;bottom:0;background:#171b22}
  .form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .form .full{grid-column:1/-1}
  .form label{display:flex;flex-direction:column;gap:4px;font-size:11.5px;color:#8f99a4}
  .form input,.form select{height:32px;border-radius:8px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--text);padding:0 9px;font:inherit;font-size:13px;width:100%}
  .form .check{flex-direction:row;align-items:center;gap:8px}
  .form .check input{width:16px;height:16px}
  .toast{position:fixed;left:50%;bottom:44px;transform:translateX(-50%);background:#20262f;border:1px solid var(--line);color:var(--text);padding:9px 14px;border-radius:10px;font-size:12.5px;z-index:80;box-shadow:0 10px 30px #0007;max-width:90vw}
  .err{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:90;padding:40px;text-align:center;color:#ffb3b3}
  .err pre{margin-top:12px;font-size:12px;color:#9aa3af;max-width:80vw;overflow:auto;text-align:left}
  .light{--bg:#f4f6fa;--panel:#fff;--line:#dfe4ec;--sub:#65707e;--text:#1b2027;--blue-dim:rgba(76,141,255,.12)}
  body.light .top{background:linear-gradient(180deg,#fff,#f8fafc)}
  body.light .grp-row{background:#eef2f8}
  body.light .modal{background:#fff}
  body.light .modal .mh,body.light .modal .mf{background:#fff}
  body.light .btn{background:#fff}
  body.light .tag{color:#53606f}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><span class="mark">SETTLEMENT<br>TOOLS</span><span class="cn">制作结算台</span></div>
  <button class="ledger" id="ledgerBtn" title="重命名 / 切换工作台">
    <span class="dot"></span><span class="name" id="ledgerName">工作台1</span><span class="menu">▾ 重命名 / 切换</span>
  </button>
  <button class="btn ghost" data-act="prices">改价</button>
  <button class="btn ghost" data-act="import">导入记录</button>
  <button class="btn ghost" data-act="theme">主题</button>
  <select class="select" id="cycleSelect" title="结算周期">
    <option value="natural">自然月（1号-月末）</option>
  </select>
  <input type="month" id="monthInput" title="结算月份">
  <div class="spacer"></div>
  <button class="btn ghost" data-act="settings">设置</button>
  <button class="btn primary" data-act="export">导出 Excel</button>
  <span class="select" title="界面语言">中文</span>
  <span class="select" title="界面缩放">100%</span>
</header>

<div class="body">
  <nav class="nav">
    <div class="grp">日常</div>
    <button class="it on" data-nav="records"><i></i><span class="k">记录登记</span><span class="n" id="navRecordCount">0</span></button>
    <button class="it" data-nav="prices"><i></i><span class="k">项目与价格</span></button>
    <button class="it" data-nav="audit"><i></i><span class="k">结算核对</span></button>
    <div class="grp">核对</div>
    <button class="it" data-nav="finalcut"><i></i><span class="k">成片校准</span></button>
    <button class="it" data-nav="sources"><i></i><span class="k">校准来源</span></button>
    <button class="it" data-nav="bulk"><i></i><span class="k">批量编辑</span></button>
    <div class="grp">维护</div>
    <button class="it" data-nav="backup"><i></i><span class="k">备份与恢复</span><span class="n" id="backupTag">周备</span></button>
    <button class="it" data-nav="dupes"><i></i><span class="k">检查重复入库</span><span class="n">清零</span></button>
  </nav>

  <section class="main">
    <div class="chips" id="chips"></div>
    <div class="kpis">
      <div class="kpi"><div class="l">工作记录数</div><div class="v"><span id="kpiCount">0</span><span class="u">条</span></div><div class="foot" id="kpiCountFoot">计价 0 条 · 不计价 0 条</div></div>
      <div class="kpi"><div class="l">工作时长</div><div class="v"><span id="kpiMin">0.0</span><span class="u">分钟</span></div><div class="foot">按秒汇总后一次折算 · 与导出口径一致</div></div>
      <div class="kpi"><div class="l"><span id="kpiFeeLabel">月结算</span><button class="eye" id="feeEye" title="显示 / 隐藏金额">◉</button></div><div class="v" id="kpiFee">¥0.00</div><div class="foot" id="kpiFeeFoot">全部结算期累计 ¥0.00</div></div>
    </div>

    <div class="drop">
      <span class="hint" id="dropHint">拖入 WAV / MP4 / 文件夹，或 JSON 备份 —— 识别后预览，点「确认导入」落库</span>
      <button class="btn" data-act="pick">选择文件</button>
      <button class="btn ghost" data-act="paste">粘贴路径</button>
    </div>

    <div class="cal">
      <div class="head">
        <button class="btn ghost icon" id="calPrev" title="上个月">‹</button>
        <span class="t" id="calTitle"></span>
        <span class="meta" id="calMeta"></span>
        <div class="spacer"></div>
        <button class="btn ghost" id="calYear" title="近 12 个月工作量热力图">年度</button>
        <button class="btn ghost" id="calToday">回到本月</button>
        <button class="btn ghost" id="calClear" hidden>看整月</button>
        <button class="btn ghost" id="calToggle">收起</button>
      </div>
      <div class="days" id="calDays"></div>
    </div>

    <div class="table">
      <div class="tscroll" id="tableScroll">
        <div class="thead" id="tableHead"></div>
        <div class="tbody" id="tableBody"></div>
      </div>
      <div class="total" id="total"></div>
    </div>
  </section>

  <aside class="side">
    <div class="hd"><span class="t">筛选与详情</span><div class="spacer"></div><button class="btn ghost" data-act="float" title="侧栏浮动（下一阶段）">浮动</button></div>
    <div class="field"><label>搜索</label><input id="q" type="search" placeholder="集号 / 项目 / 文件名…" autocomplete="off"></div>
    <div class="field"><label>项目</label><select class="select" id="fProject"></select></div>
    <div class="field"><label>等级</label><select class="select" id="fGrade"><option value="">全部</option><option>A</option><option>B</option><option>C</option><option>D</option><option value="none">待定级</option></select></div>
    <div class="field"><label>计价状态</label><select class="select" id="fBilling"><option value="">全部</option><option value="billed">已计价</option><option value="excluded">不计价</option><option value="pending">待定级</option></select></div>
    <button class="more" id="moreBtn"><span>更多筛选</span><span class="n">6</span><div class="spacer"></div><span id="moreCaret">▾</span></button>
    <div class="more-panel" id="morePanel">
      <div class="field"><label>类型</label><select class="select" id="fType"><option value="">全部</option><option>正式</option><option>Demo</option></select></div>
      <div class="field"><label>工作类型</label><select class="select" id="fWork"><option value="">全部</option><option>混音</option><option>重混</option><option>修改</option></select></div>
      <div class="field"><label>计价方式</label><select class="select" id="fMode"><option value="">全部</option><option>按时长</option><option>按集</option></select></div>
      <div class="field"><label>起止日期</label><div style="display:flex;gap:6px"><input type="date" id="fFrom"><input type="date" id="fTo"></div></div>
    </div>
    <div class="hintbox">点某天查看当日记录；点记录行可选中，双击打开详情编辑。<br>金额可点眼睛临时隐藏；筛选状态实时生效。</div>
    <div class="active"><span>已选</span><b id="selCount">0</b><span>条</span><button class="clr" id="clearFilters">清除筛选</button></div>
  </aside>
</div>

<footer class="status">
  <span style="color:#9dbcf5">新前端 · 布局重写版</span>
  <span id="statusLedger">账本加载中…</span>
  <span id="statusPath">数据目录 —</span>
  <span id="statusBackup">周备份 —</span>
  <div class="spacer"></div>
  <button class="undo" id="undoBtn" disabled>撤销上一步</button>
  <span id="statusVersion">制作结算台</span>
</footer>

<div id="modalRoot"></div>
<script>
(function () {
  'use strict';
  const $ = (sel, root) => (root || document).querySelector(sel);
  const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));
  const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const store = window.workspaceStorage || localStorage;
  const BILL = window.SettlementBilling;
  const UI_KEY = 'settlement-next-ui-v1';
  const UNDO_KEY = 'settlement-next-undo-v1';
  const state = {
    business: null,
    ui: loadUi(),
    filters: {q:'', project:'', grade:'', billing:'', type:'', work:'', mode:'', from:'', to:'', date:''},
    month: monthOf(new Date()),
    sort: {key:'episode', dir:1},
    selected: new Set(),
    collapsed: new Set(),
    moreOpen: false,
    undo: null,
    revision: null,
    path: '',
  };

  function loadUi() {
    try { return Object.assign({amountVisible:true, theme:'dark'}, JSON.parse(localStorage.getItem(UI_KEY) || '{}')); }
    catch (_) { return {amountVisible:true, theme:'dark'}; }
  }
  function saveUi() { try { localStorage.setItem(UI_KEY, JSON.stringify(state.ui)); } catch (_) {} }
  function monthOf(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); }
  function pad(n) { return String(n).padStart(2, '0'); }
  function escAttr(v){ return esc(v).replace(/`/g,'&#96;'); }

  function readStore(key) { try { return store.getItem(key); } catch (_) { return null; } }
  function writeStore(key, value) {
    try { store.setItem(key, value); return true; }
    catch (error) { toast('保存失败：' + error.message); return false; }
  }

  function loadBusiness() {
    const raw = readStore('settlement_v1');
    if (!raw) return {schemaVersion:1, prices:{A:{per_min:78,per_ep:78},B:{per_min:30,per_ep:30},C:{per_min:15,per_ep:15},D:{per_min:10,per_ep:10}}, projects:[], premiumPrices:BILL ? BILL.defaultPremiumPrices() : {}};
    const data = JSON.parse(raw);
    data.projects = Array.isArray(data.projects) ? data.projects : [];
    data.prices = data.prices && typeof data.prices === 'object' ? data.prices : {};
    return data;
  }

  function snapshot() { return JSON.stringify(state.business); }
  function pushUndo(raw) {
    state.undo = raw;
    try { localStorage.setItem(UNDO_KEY, raw); } catch (_) {}
    renderStatus();
  }
  function commit(mutator, label) {
    const before = snapshot();
    mutator();
    if (!writeStore('settlement_v1', snapshot())) return false;
    pushUndo(before);
    refresh();
    if (label) toast(label);
    return true;
  }
  function undoLast() {
    if (!state.undo) return;
    const before = state.undo;
    if (!writeStore('settlement_v1', before)) return;
    state.business = JSON.parse(before);
    state.undo = null;
    try { localStorage.removeItem(UNDO_KEY); } catch (_) {}
    state.selected.clear();
    refresh();
    toast('已撤销上一步');
  }

  function recordOf(project, key, rec) {
    const record = Object.assign({}, rec);
    record.episodeNo = /^\d+$/.test(key) ? key : (String(rec.episodeNo || '').match(/\d+/) || [null])[0];
    record.type = rec.type || project.type || '正式';
    record.mode = rec.mode || project.mode || '按时长';
    record.label = key;
    return record;
  }
  function allRecords() {
    const rows = [];
    (state.business.projects || []).forEach((project, pi) => {
      const episodes = project.episodes || {};
      Object.keys(episodes).forEach(key => {
        const rec = episodes[key];
        if (!rec || typeof rec !== 'object') return;
        const record = recordOf(project, key, rec);
        let grade = null, fee = 0, sec = 0, billable = true, reason = null;
        try { grade = BILL.grade(project, record); } catch (_) {}
        try { billable = BILL.isBillable(record); reason = BILL.exclusionReason(record); } catch (_) {}
        try { sec = BILL.durationSeconds(record.duration || '00:00:00') || 0; } catch (_) {}
        try { fee = BILL.fee(state.business.prices || {}, project, record, state.business.premiumPrices) || 0; } catch (_) {}
        rows.push({project, pi, key, record, grade, fee, sec, billable, reason, date: rec.date || '', workType: record.workType || BILL.workType(record) || '混音'});
      });
    });
    return rows;
  }

  function labelOf(row) {
    const key = row.key;
    if (key.indexOf('demo:') === 0) return {text:'Demo', version:'Demo'};
    const num = (key.match(/\d+/) || [])[0];
    if (num) {
      let version = row.record.version || row.record.versionLabel || '';
      if (!version && key.indexOf('@') >= 0) version = 'V' + (row.record.ver || 1);
      return {text:'EP' + num.padStart(2,'0'), version: version};
    }
    return {text:key, version: ''};
  }

  function filtered(records) {
    const f = state.filters;
    const q = f.q.trim().toLowerCase();
    return records.filter(row => {
      if (f.project && row.project.name !== f.project) return false;
      if (f.grade) {
        if (f.grade === 'none') { if (row.grade) return false; }
        else if (row.grade !== f.grade) return false;
      }
      if (f.billing) {
        const bucket = !row.billable ? 'excluded' : (row.grade ? 'billed' : 'pending');
        if (bucket !== f.billing) return false;
      }
      if (f.type && (row.record.type || row.project.type) !== f.type) return false;
      if (f.work && row.workType !== f.work) return false;
      if (f.mode && (row.record.mode || row.project.mode) !== f.mode) return false;
      if (f.from && (!row.date || row.date < f.from)) return false;
      if (f.to && (!row.date || row.date > f.to)) return false;
      if (f.date && row.date !== f.date) return false;
      if (q) {
        const label = labelOf(row).text;
        const epRaw = row.record.episodeNo ? ('EP' + Number(row.record.episodeNo)) : '';
        const hay = (row.project.name + ' ' + row.key + ' ' + label + ' ' + epRaw + ' ' + row.workType + ' ' + (row.record.fileName || '') + ' ' + (row.record.sourceFile || '')).toLowerCase();
        if (hay.indexOf(q) < 0) return false;
      }
      return true;
    });
  }

  function summarize(list) {
    let fee = 0, sec = 0, billed = 0, billable = 0;
    list.forEach(r => { fee += r.fee; sec += r.sec; if (r.billable) billable++; if (r.billable && r.grade) billed++; });
    return {eps:list.length, min:Math.round(sec / 60 * 10) / 10, fee:Math.round(fee * 100) / 100, billed, billable, excluded:list.length - billable, pending:list.filter(r => r.billable && !r.grade).length};
  }
  function money(n) { return '¥' + (Math.round(n * 100) / 100).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
  function masked(text) { return state.ui.amountVisible ? text : '••••••'; }

  function rowsByMonth(records) {
    return records.filter(r => !state.month || (r.date && r.date.slice(0, 7) === state.month));
  }
  function monthLabel() {
    const [y, m] = state.month.split('-');
    return y + '年' + Number(m) + '月';
  }

  function refresh() {
    const all = allRecords();
    const inMonth = rowsByMonth(all);
    const list = filtered(inMonth);
    renderChips(list);
    renderKpis(list, filtered(all));
    renderCalendar(inMonth, list);
    renderTable(list);
    renderSide(all);
    renderStatus();
  }

  function renderChips(list) {
    const sum = summarize(list);
    const chips = [];
    chips.push(chip('结算期 ' + monthLabel(), 'period'));
    if (state.filters.project) chips.push(chip('项目 ' + state.filters.project, 'project'));
    chips.push(chip('计价 ' + billingLabel(), 'billing'));
    if (state.filters.date) chips.push(chip('日期 ' + state.filters.date.slice(5), 'date'));
    const html = chips.join('') + '<button class="clr" id="clearAll">清除全部</button><div class="spacer"></div>' +
      '<span class="scope">工作明细 · <b>' + sum.eps + ' 条</b> · <b>' + sum.min + ' 分</b> · <b>' + masked(money(sum.fee)) + '</b></span>';
    const box = $('#chips');
    box.innerHTML = html;
    $$('#chips .x').forEach(btn => btn.onclick = () => {
      const kind = btn.dataset.kind;
      if (kind === 'project') state.filters.project = '';
      if (kind === 'billing') state.filters.billing = '';
      if (kind === 'date') state.filters.date = '';
      if (kind === 'period') { state.month = monthOf(new Date()); $('#monthInput').value = state.month; }
      refresh();
    });
    $('#clearAll').onclick = clearFilters;
    $('#navRecordCount').textContent = sum.eps;
  }
  function chip(text, kind) { return '<span class="chip"><b>' + esc(text) + '</b><button class="x" data-kind="' + kind + '" title="移除">×</button></span>'; }
  function billingLabel() {
    const v = state.filters.billing;
    return v === 'billed' ? '已计价' : v === 'excluded' ? '不计价' : v === 'pending' ? '待定级' : '全部';
  }

  function renderKpis(list, allMonthFiltered) {
    const sum = summarize(list);
    $('#kpiCount').textContent = sum.eps;
    $('#kpiCountFoot').textContent = '计价 ' + sum.billed + ' 条 · 不计价 ' + sum.excluded + ' 条';
    $('#kpiMin').textContent = sum.min.toFixed(1);
    $('#kpiFeeLabel').textContent = monthLabel() + ' · 月结算';
    $('#kpiFee').textContent = masked(money(sum.fee));
    const total = summarize(allMonthFiltered);
    $('#kpiFeeFoot').textContent = '全部累计 ' + masked(money(total.fee)) + ' · 查看全部历史';
    $('#navRecordCount').textContent = sum.eps;
  }

  function renderCalendar(inMonth, list) {
    const [y, m] = state.month.split('-').map(Number);
    const days = new Date(y, m, 0).getDate();
    const title = monthLabel();
    const dayCounts = new Map();
    inMonth.forEach(r => { if (r.date && r.date.slice(0, 7) === state.month) dayCounts.set(r.date, (dayCounts.get(r.date) || 0) + 1); });
    const fee = summarize(inMonth);
    $('#calTitle').textContent = title;
    $('#calMeta').textContent = days + ' 天 · 有记录 ' + dayCounts.size + ' 天 · ' + fee.eps + ' 条 · ' + masked(money(fee.fee));
    $('#calClear').hidden = !state.filters.date;
    const grid = $('#calDays');
    grid.className = 'days';
    const collapsed = calCollapsed();
    grid.classList.toggle('collapsed', collapsed);
    $('#calToggle').textContent = collapsed ? '展开' : '收起';
    const today = monthOf(new Date()) === state.month ? new Date().getDate() : 0;
    grid.innerHTML = Array.from({length: days}, (_, i) => {
      const d = i + 1, key = state.month + '-' + pad(d), n = dayCounts.get(key) || 0;
      return '<button class="d' + (n ? ' has' : '') + (d === today ? ' today' : '') + (state.filters.date === key ? ' on' : '') + '" data-date="' + key + '" title="' + key + ' · ' + n + ' 条">' + d + '</button>';
    }).join('');
    $$('#calDays .d').forEach(cell => cell.onclick = () => {
      const key = cell.dataset.date;
      state.filters.date = state.filters.date === key ? '' : key;
      refresh();
    });
  }

  function calCollapsed() {
    if (typeof state.ui.calCollapsed === 'boolean') return state.ui.calCollapsed;
    return window.innerHeight < 640;
  }

  function renderTable(list) {
    const head = $('#tableHead');
    const cols = [
      ['项目 / 集号', 'episode'], ['工作类型', ''], ['工作日期', 'date'], ['时长', 'duration'],
      ['等级', 'grade'], ['计价', ''], ['单价', ''], ['金额', 'fee']
    ];
    head.innerHTML = cols.map(([label, key]) => {
      if (!key) return '<span>' + label + '</span>';
      const on = state.sort.key === key;
      return '<button class="' + (on ? 'active' : '') + '" data-sort="' + key + '">' + label + '<span class="arrow">' + (on ? (state.sort.dir > 0 ? '↑' : '↓') : '↕') + '</span></button>';
    }).join('');
    $$('#tableHead [data-sort]').forEach(btn => btn.onclick = () => {
      const key = btn.dataset.sort;
      state.sort.dir = state.sort.key === key ? -state.sort.dir : 1;
      state.sort.key = key;
      refresh();
    });

    const body = $('#tableBody');
    if (!list.length) {
      body.innerHTML = '<div class="row empty">当前筛选下没有记录。试试切换月份、清空筛选，或导入新的记录。</div>';
      renderTotal(list);
      return;
    }
    let groups;
    if (state.sort.key === 'episode') {
      groups = new Map();
      list.forEach(r => { if (!groups.has(r.project.name)) groups.set(r.project.name, []); groups.get(r.project.name).push(r); });
      for (const arr of groups.values()) arr.sort((a, b) => (Number(a.record.episodeNo || 0) - Number(b.record.episodeNo || 0)) || a.key.localeCompare(b.key));
    } else {
      const sorted = list.slice().sort((a, b) => {
        const va = state.sort.key === 'date' ? a.date : state.sort.key === 'duration' ? a.sec : state.sort.key === 'grade' ? (a.grade || '') : a.fee;
        const vb = state.sort.key === 'date' ? b.date : state.sort.key === 'duration' ? b.sec : state.sort.key === 'grade' ? (b.grade || '') : b.fee;
        return (va > vb ? 1 : va < vb ? -1 : 0) * state.sort.dir;
      });
      groups = new Map([['__flat', sorted]]);
    }

    const html = [];
    for (const [name, arr] of groups) {
      if (name !== '__flat' && !state.collapsed.has(name)) {
        const sum = summarize(arr);
        const level = arr[0].grade || '—';
        const mode = arr[0].record.mode || arr[0].project.mode || '按时长';
        const cat = arr[0].project.billingCategory === 'automation' ? '<span class="tag auto">自动化（D）</span>' : '<span class="tag">手工</span>';
        html.push('<div class="grp-row"><button class="caret" data-group="' + escAttr(name) + '">▾</button><span class="nm">' + esc(name) + '</span>' + cat +
          '<span class="sum">' + sum.eps + ' 条 · ' + sum.min.toFixed(1) + ' 分 · ' + level + ' 级 · ' + esc(mode) + '</span>' +
          '<span class="fee">' + masked(money(sum.fee)) + '</span></div>');
      }
      if (name !== '__flat' && state.collapsed.has(name)) {
        const sum = summarize(arr);
        html.push('<div class="grp-row"><button class="caret" data-group="' + escAttr(name) + '">▸</button><span class="nm">' + esc(name) + '</span><span class="sum">' + sum.eps + ' 条 · ' + sum.min.toFixed(1) + ' 分</span><span class="fee">' + masked(money(sum.fee)) + '</span></div>');
        continue;
      }
      for (const row of arr) html.push(rowHtml(row));
    }
    body.innerHTML = html.join('');
    $$('#tableBody [data-group]').forEach(btn => btn.onclick = () => {
      const name = btn.dataset.group;
      if (state.collapsed.has(name)) state.collapsed.delete(name); else state.collapsed.add(name);
      renderTable(list);
    });
    $$('#tableBody .row[data-key]').forEach(el => {
      el.onclick = event => {
        if (event.detail > 1) return;
        const id = el.dataset.key;
        if (state.selected.has(id)) state.selected.delete(id); else state.selected.add(id);
        el.classList.toggle('sel', state.selected.has(id));
        $('#selCount').textContent = state.selected.size;
      };
      el.ondblclick = () => openEditor(el.dataset.pi, el.dataset.k);
    });
    renderTotal(list);
  }

  function rowHtml(row) {
    const label = labelOf(row);
    const tag = '<span class="tag">' + esc(row.record.type || '正式') + '</span>';
    const billing = !row.billable ? '<span class="tag">' + (row.reason === 'modify' ? '修改不计价' : '已排除') + '</span>'
      : !row.grade ? '<span class="tag m">待定级</span>' : '<span class="tag g">已计价</span>';
    let unit = '—';
    if (row.billable && row.grade) {
      try {
        const rate = BILL.rateOf(state.business.prices || {}, row.project, row.record, state.business.premiumPrices);
        unit = (row.record.mode || row.project.mode) === '按集' ? '¥' + rate.per_ep + '/集' : '¥' + rate.per_min + '/分';
      } catch (_) {}
    }
    const id = row.project.name + '\u0001' + row.key;
    return '<div class="row' + (state.selected.has(id) ? ' sel' : '') + '" data-key="' + escAttr(id) + '" data-pi="' + row.pi + '" data-k="' + escAttr(row.key) + '">' +
      '<span class="ep">' + esc(label.text) + (label.version ? '<span class="tag">' + esc(label.version) + '</span>' : '') + tag + '</span>' +
      '<span class="type">' + esc(row.workType) + '</span>' +
      '<span class="date">' + esc(row.date ? row.date.slice(5) : '—') + '</span>' +
      '<span class="dur">' + (row.sec / 60).toFixed(1) + ' 分</span>' +
      '<span class="grade">' + esc(row.grade || '—') + '</span>' +
      '<span>' + billing + '</span>' +
      '<span class="price">' + esc(unit) + '</span>' +
      '<span class="fee">' + masked(money(row.fee)) + '</span></div>';
  }

  function renderTotal(list) {
    const sum = summarize(list);
    $('#total').innerHTML = '<span>共计 <b>' + sum.eps + '</b> 条</span><span>共计时长 <b>' + sum.min.toFixed(1) + '</b> 分</span>' +
      '<span>不计价 <b>' + sum.excluded + '</b> 条</span><span>待定级 <b>' + sum.pending + '</b> 条</span>' +
      '<div class="spacer"></div><span>工作明细 · ' + monthLabel() + '</span><span>金额 <b>' + masked(money(sum.fee)) + '</b></span>';
  }

  function renderSide(all) {
    const projectSel = $('#fProject');
    const names = Array.from(new Set(all.map(r => r.project.name))).sort((a, b) => a.localeCompare(b, 'zh'));
    projectSel.innerHTML = '<option value="">全部</option>' + names.map(n => '<option value="' + escAttr(n) + '">' + esc(n) + '</option>').join('');
    projectSel.value = state.filters.project;
    $('#selCount').textContent = state.selected.size;
  }

  function renderStatus() {
    $('#statusVersion').textContent = '制作结算台 ' + (window.SETTLEMENT_VERSION || '');

  async function importFiles(files) {

    for (const file of Array.from(files)) rows.push(guessRow(file, await probeDuration(file)));
    const modal = openModal('导入记录 · 待确认', '<div id="importList" style="display:grid;gap:6px;max-height:52vh;overflow:auto"></div>',

  function probeDuration(file) {
    return new Promise(resolve => {
      const url = URL.createObjectURL(file);
      const media = document.createElement(file.type.indexOf('video') === 0 ? 'video' : 'audio');
      let done = false;
      const finish = value => { if (done) return; done = true; URL.revokeObjectURL(url); resolve(value); };
      media.preload = 'metadata';
      media.onloadedmetadata = () => finish(Number.isFinite(media.duration) ? media.duration : null);
      media.onerror = () => finish(null);
      setTimeout(() => finish(null), 3500);
      media.src = url;
    });
  }

  function secText(seconds) {
    if (!Number.isFinite(seconds)) return '00:00:00';
    const total = Math.round(seconds);
    return [Math.floor(total / 3600), Math.floor(total % 3600 / 60), total % 60].map(n => String(n).padStart(2, '0')).join(':');
  }

  function guessRow(file, seconds) {
    const path = file.webkitRelativePath || file.name;
    const name = file.name;
    const projects = state.business.projects;
    const hit = projects.map(pr => {
      const keys = [pr.name].concat(Array.isArray(pr.aliases) ? pr.aliases : []).filter(Boolean);
      const match = keys.find(k => path.indexOf(k) >= 0);
      return match ? {project: pr, score: match.length} : null;
    }).filter(Boolean).sort((a, b) => b.score - a.score)[0];
    let ep = '';
    const patterns = [/EP[\s_-]*(\d+)/i, /(\d+)\s*集/, /第\s*(\d+)\s*[集话]/, /^\D*(\d{1,4})\D/];
    for (const re of patterns) { const m = name.match(re); if (m) { ep = String(Number(m[1])); break; } }
    const isDemo = /demo/i.test(name);
    const isRevise = /修改|revise/i.test(name);
    return {
      file,
      projectIndex: hit ? projects.indexOf(hit.project) : -1,
      ep,
      date: new Date(file.lastModified || Date.now()).toISOString().slice(0, 10),
      duration: secText(seconds),
      seconds,
      type: isDemo ? 'Demo' : '正式',
      workType: isRevise ? '修改' : '混音',
      workMode: hit ? (hit.project.mode || '按时长') : '按时长'
    };
  }

      '<select data-i="' + i + '" data-k="projectIndex" style="height:28px"><option value="-1">选择项目…</option>' + projects.map((pr, pi) => '<option value="' + pi + '" ' + (pi === row.projectIndex ? 'selected' : '') + '>' + esc(pr.name) + '</option>').join('') + '</select>' +
      '<input data-i="' + i + '" data-k="ep" value="' + escAttr(row.ep) + '" placeholder="集号" style="height:28px;width:100%;min-width:0;text-align:center">' +
      '<input data-i="' + i + '" data-k="date" type="date" value="' + escAttr(row.date) + '" style="height:28px;width:100%">' +
      '<input data-i="' + i + '" data-k="duration" value="' + escAttr(row.duration) + '" style="height:28px;width:100%;text-align:center">' +
      '<select data-i="' + i + '" data-k="type" style="height:28px"><option ' + (row.type === '正式' ? 'selected' : '') + '>正式</option><option ' + (row.type === 'Demo' ? 'selected' : '') + '>Demo</option></select>' +
      '</div>').join('');
    list.querySelectorAll('input,select').forEach(el => {
      el.onchange = () => {
        const row = rows[Number(el.dataset.i)];
        row[el.dataset.k] = el.dataset.k === 'projectIndex' ? Number(el.value) : el.value;
      };

  function confirmImport(modal, rows) {
    if (!rows.length) { toast('先选择文件'); return; }
    const valid = rows.filter(r => r.projectIndex >= 0 && /^\d+$/.test(String(r.ep)));
    if (!valid.length) { toast('至少给一条记录选择项目并填写集号'); return; }
    if (valid.length < rows.length) {
      if (!confirm('有 ' + (rows.length - valid.length) + ' 条没填项目或集号，将跳过。继续导入 ' + valid.length + ' 条？')) return;
    }
    commit(() => {
      for (const row of valid) {
        const project = state.business.projects[row.projectIndex];
        project.episodes = project.episodes || {};
        let key = String(Number(row.ep));
        if (project.episodes[key]) key = key + '@' + Date.now() + '-' + Math.floor(Math.random() * 1000);
        project.episodes[key] = {
          date: row.date,
          duration: row.duration,
          workType: row.workType,
          excluded: false,
          mode: project.mode || row.workMode || '按时长',
          type: row.type,
          sourceFile: row.file.name,
          sourcePath: row.file.webkitRelativePath || row.file.name,
          recordId: 'record-next-' + Math.random().toString(16).slice(2) + Date.now().toString(16),
          importedAt: new Date().toISOString()
        };
      }
    }, '已导入 ' + valid.length + ' 条记录');
    closeModal();
    const month = valid[0].date.slice(0, 7);
    if (month && month !== state.month) { state.month = month; $('#monthInput').value = month; }
    refresh();
  }

    const list = filtered(rowsByMonth(allRecords()));
    const rows = list.map(r => ({
      '项目': r.project.name, '集号': labelOf(r).text, '版本': r.record.type || r.project.type || '正式',
      '工作类型': r.workType, '工作日期': r.date, '时长': r.record.duration || '00:00:00',
      '时长（分）': (r.sec / 60).toFixed(2), '等级': r.grade || '',
      '计价': r.billable ? (r.grade ? '已计价' : '待定级') : '不计价',
      '单价': (() => { try { const rt = BILL.rateOf(state.business.prices || {}, r.project, r.record, state.business.premiumPrices); return (r.record.mode || r.project.mode) === '按集' ? rt.per_ep : rt.per_min; } catch (_) { return ''; } })(),
      '金额': r.fee
    }));
    const sum = summarize(list);
    rows.push({'项目': '合计', '集号': sum.eps + ' 条', '时长（分）': sum.min.toFixed(1), '金额': sum.fee});
    const sheet = XLSX.utils.json_to_sheet(rows);
    sheet['!cols'] = [{wch:26},{wch:8},{wch:8},{wch:10},{wch:12},{wch:10},{wch:10},{wch:6},{wch:10},{wch:8},{wch:10}];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, sheet, '工作明细');
    const name = '制作结算台-' + monthLabel() + '.xlsx';
    XLSX.writeFile(wb, name);
    toast('已导出 ' + name + '（' + sum.eps + ' 条 / ' + money(sum.fee) + '）');
  }

  function dayHeatMap() {
    const memo = new Map();
    allRecords().forEach(r => {
      const key = String(r.date || '').slice(0, 10);
      if (!/^\d{4}-\d{2}-\d{2}$/.test(key)) return;
      const cur = memo.get(key) || {n: 0, min: 0, fee: 0};
      cur.n += 1;
      cur.min += (r.sec || 0) / 60;
      cur.fee += (r.fee || 0);
      memo.set(key, cur);
    });
    return memo;
  }

  function openYearHeatmap() {
    const rawMap = dayHeatMap();
    const [y, m] = state.month.split('-').map(Number);
    const end = new Date(y, m, 0);
    const start = new Date(y, m - 12, 1);
    const gridStart = new Date(start);
    gridStart.setDate(gridStart.getDate() - ((gridStart.getDay() + 6) % 7));
    const gridEnd = new Date(end);
    gridEnd.setDate(gridEnd.getDate() + (6 - ((gridEnd.getDay() + 6) % 7)));
    const startKey = start.getFullYear() + '-' + pad(start.getMonth() + 1) + '-' + pad(start.getDate());
    const endKey = end.getFullYear() + '-' + pad(end.getMonth() + 1) + '-' + pad(end.getDate());
    const map = new Map();
    rawMap.forEach((v, k) => { if (k >= startKey && k <= endKey) map.set(k, v); });
    const dayMs = 86400000;
    const span = Math.round((gridEnd - gridStart) / dayMs) + 1;
    const cols = Math.ceil(span / 7);
    const todayKey = monthOf(new Date()) + '-' + pad(new Date().getDate());
    let metric = 'min';

    const monthLabels = [];
    for (let i = 0; i < 12; i++) {
      const d = new Date(start.getFullYear(), start.getMonth() + i, 1);
      monthLabels.push({text: (d.getMonth() + 1) + '月', col: Math.max(0, Math.floor((d - gridStart) / dayMs / 7))});
    }

    function valueOf(item) { return metric === 'fee' ? item.fee : item.min; }
    function levelOf(v, max) {
      if (!(v > 0)) return 0;
      return Math.max(1, Math.min(4, Math.ceil(Math.pow(v / max, 0.55) * 4)));
    }

    function chartHtml() {
      let vals = [];
      map.forEach(item => { const v = valueOf(item); if (v > 0) vals.push(v); });
      const max = vals.length ? Math.max.apply(null, vals) : 1;
      let out = '<div class="hm-months" style="grid-template-columns:repeat(' + cols + ',12px)">' +
        monthLabels.map(x => '<span style="grid-column:' + (x.col + 1) + '/span 4">' + x.text + '</span>').join('') + '</div>';
      out += '<div class="hm-body"><div class="hm-wd"><span>一</span><span></span><span>三</span><span></span><span>五</span><span></span><span>日</span></div><div class="hm-grid">';
      for (let c = 0; c < cols; c++) {
        out += '<div class="hm-col">';
        for (let row = 0; row < 7; row++) {
          const d = new Date(gridStart); d.setDate(d.getDate() + c * 7 + row);
          const key = d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
          if (d < start || d > end) { out += '<span class="hm-cell blank"></span>'; continue; }
          const item = map.get(key);
          const v = item ? valueOf(item) : 0;
          const lv = item ? levelOf(v, max) : 0;
          const title = key + (item ? ' · ' + item.n + ' 条 · ' + item.min.toFixed(1) + ' 分 · ' + masked(money(item.fee)) : ' · 无记录');
          out += '<button class="hm-cell' + (lv ? ' lv' + lv : '') + (key === todayKey ? ' today' : '') + '" data-date="' + key + '" title="' + escAttr(title) + '"></button>';
        }
        out += '</div>';
      }
      return out + '</div></div>';
    }

    const body = '<div class="hm-head"><div class="hm-seg"><button data-hm="min" class="on">按工时</button><button data-hm="fee">按金额</button></div>' +
      '<span class="spacer"></span><span>近 12 个月 · ' + start.getFullYear() + ' 年 ' + (start.getMonth() + 1) + ' 月 → ' + (end.getFullYear()) + ' 年 ' + (end.getMonth() + 1) + ' 月</span></div>' +
      '<div class="hm-chart"><div class="hm-inner"><div id="hmChart">' + chartHtml() + '</div>' +
      '<div class="hm-stats" id="hmStats"></div></div></div>' +
      '<div class="hm-legend"><span>少</span><i class="lv1"></i><i class="lv2"></i><i class="lv3"></i><i class="lv4"></i><span>多</span><span style="margin-left:8px">· 点任意一天跳到当日记录</span></div>';

    const modal = openModal('年度工作量热力图', body, '', true);
    const chartBox = $('#hmChart', modal);
    const statsBox = $('#hmStats', modal);
    function paint() {
      chartBox.innerHTML = chartHtml();
      const sum = summarize(Array.from(map.keys()).map(k => ({date: k, fee: map.get(k).fee, sec: map.get(k).min * 60, billable: true}))); 
      const active = Array.from(map.values()).filter(x => x.n > 0);
      const peak = active.reduce((a, b) => (a && a.min >= b.min ? a : b), null);
      statsBox.innerHTML = '<span>活跃 <b>' + active.length + '</b> 天</span><span>·</span><span>工时 <b>' + sum.min.toFixed(1) + '</b> 分</span><span>·</span><span>金额 <b>' + masked(money(sum.fee)) + '</b></span><span>·</span><span>最高单日 <b>' + (peak ? peak.min.toFixed(1) : '0.0') + '</b> 分</span>';
      $$('.hm-cell[data-date]', chartBox).forEach(cell => cell.onclick = () => {
        const key = cell.dataset.date;
        state.month = key.slice(0, 7);
        state.filters.date = key;
        $('#monthInput').value = state.month;
        closeModal();
        refresh();
      });
    }
    $$('[data-hm]', modal).forEach(btn => btn.onclick = () => {
      metric = btn.dataset.hm;
      $$('[data-hm]', modal).forEach(b => b.classList.toggle('on', b === btn));
      paint();
    });
    paint();
  }

  function openModal(title, body, footer, wide) {
    closeModal();
    const back = document.createElement('div');
    back.className = 'modal-back';
    back.innerHTML = '<div class="modal' + (wide ? ' modal-wide' : '') + '" role="dialog" aria-modal="true"><div class="mh"><span class="t">' + esc(title) + '</span><div class="spacer"></div><button class="btn ghost sm" data-close>关闭</button></div>' +
      '<div class="mb">' + body + '</div>' + (footer ? '<div class="mf">' + footer + '</div>' : '') + '</div>';
    back.addEventListener('click', e => { if (e.target === back) closeModal(); });
    $$('[data-close]', back).forEach(btn => btn.onclick = closeModal);
    $('#modalRoot').appendChild(back);
    return back;
  }
  function closeModal() { $('#modalRoot').innerHTML = ''; }
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

  let toastTimer = null;
  function toast(message) {
    let el = $('#toast');
    if (!el) { el = document.createElement('div'); el.id = 'toast'; el.className = 'toast'; document.body.appendChild(el); }
    el.textContent = message;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.remove(), 3200);
  }

  function bindTop() {
    $('#monthInput').addEventListener('change', e => { if (e.target.value) { state.month = e.target.value; state.filters.date = ''; refresh(); } });
    $('#calPrev').onclick = () => shiftMonth(-1);
    $('#calToday').onclick = () => { state.month = monthOf(new Date()); state.filters.date = ''; $('#monthInput').value = state.month; refresh(); };
    $('#calClear').onclick = () => { state.filters.date = ''; refresh(); };
    $('#calToggle').onclick = () => { state.ui.calCollapsed = !calCollapsed(); saveUi(); refresh(); };
    $('#calYear').onclick = openYearHeatmap;
    $('#feeEye').onclick = () => { state.ui.amountVisible = !state.ui.amountVisible; saveUi(); refresh(); };
    $('#undoBtn').onclick = undoLast;
    $$('[data-act]').forEach(btn => btn.onclick = () => {
      const act = btn.dataset.act;
      if (act === 'export') exportExcel();
      else if (act === 'prices') openPrices();
      else if (act === 'import' || act === 'pick') openImport();
      else if (act === 'paste') toast('粘贴路径导入将在下一阶段接入');
      else if (act === 'theme') { state.ui.theme = state.ui.theme === 'light' ? 'dark' : 'light'; saveUi(); applyTheme(); }
      else if (act === 'settings') openSettings();
      else if (act === 'float') toast('侧栏浮动将在下一阶段接入');
    });
    $$('[data-nav]').forEach(btn => btn.onclick = () => {
      const nav = btn.dataset.nav;
      $$('[data-nav]').forEach(b => b.classList.toggle('on', b === btn));
      if (nav === 'records') { window.scrollTo({top:0}); refresh(); }
      else if (nav === 'prices') openPrices();
      else if (nav === 'bulk') openBulk();
      else if (nav === 'backup') openBackup();
      else if (nav === 'dupes') toast('重复入库检查将在下一阶段接入');
      else if (nav === 'finalcut') toast('成片校准将在下一阶段接入');
      else if (nav === 'sources') toast('校准来源将在下一阶段接入');
      else if (nav === 'audit') toast('结算核对将在下一阶段接入');
    });
    $('#ledgerBtn').onclick = () => toast('工作台重命名 / 切换将在下一阶段接入');
  }

  function shiftMonth(delta) {
    const [y, m] = state.month.split('-').map(Number);
    const d = new Date(y, m - 1 + delta, 1);
    state.month = monthOf(d);
    $('#monthInput').value = state.month;
    refresh();
  }

  function bindFilters() {
    let timer = null;
    $('#q').addEventListener('input', e => {
      clearTimeout(timer);
      timer = setTimeout(() => { state.filters.q = e.target.value; refresh(); }, 120);
    });
    const select = (id, key) => $(id).addEventListener('change', e => { state.filters[key] = e.target.value; refresh(); });
    select('#fProject', 'project');
    select('#fGrade', 'grade');
    select('#fBilling', 'billing');
    select('#fType', 'type');
    select('#fWork', 'work');
    select('#fMode', 'mode');
    $('#fFrom').addEventListener('change', e => { state.filters.from = e.target.value; refresh(); });
    $('#fTo').addEventListener('change', e => { state.filters.to = e.target.value; refresh(); });
    $('#moreBtn').onclick = () => { state.moreOpen = !state.moreOpen; syncFilterControls(); };
    const drop = document.querySelector('.drop');
    ['dragenter', 'dragover'].forEach(evt => drop.addEventListener(evt, e => { e.preventDefault(); drop.style.borderColor = 'rgba(76,141,255,.6)'; }));
    ['dragleave', 'drop'].forEach(evt => drop.addEventListener(evt, e => { e.preventDefault(); drop.style.borderColor = ''; }));
    drop.addEventListener('drop', e => {
      const files = e.dataTransfer && e.dataTransfer.files;
      if (files && files.length) importFiles(files);
    });
    $('#clearFilters').onclick = clearFilters;
  }

  function loadLedgerName() {
    try {
      const active = readStore('settlement_active_profile') || 'default';
      const list = JSON.parse(readStore('settlement_workbenches_v1') || '[]');
      const hit = Array.isArray(list) ? list.find(item => item && item.id === active) : null;
      $('#ledgerName').textContent = (hit && hit.name) || '工作台1';
    } catch (_) { $('#ledgerName').textContent = '工作台1'; }
  }

  function isoWeek(date) {
    const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
    const day = d.getUTCDay() || 7;
    d.setUTCDate(d.getUTCDate() + 4 - day);
    const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
    const week = Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
    return d.getUTCFullYear() + '-W' + String(week).padStart(2, '0');
  }

  let resizeTimer = null;
  window.addEventListener('resize', () => {
    if (typeof state.ui.calCollapsed === 'boolean') return;
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(refresh, 180);
  });

  function boot() {
    try {
      state.business = loadBusiness();
      state.month = monthOf(new Date());
      $('#monthInput').value = state.month;
      applyTheme();
      bindTop();
      bindFilters();
      try { state.undo = localStorage.getItem(UNDO_KEY); } catch (_) {}
      state.path = '';
      loadLedgerName();
      renderStatus();
      refresh();
      // 桌面模式下补一次只读状态：revision 与账本路径。
      const token = window.__settlementWorkspaceToken;
      if (token) {
        fetch('/__workspace__', {headers: {'X-Settlement-Workspace': token}}).then(r => r.ok ? r.json() : null).then(info => {
          if (!info) return;
          state.revision = info.revision;
          state.path = info.path || '';
          renderStatus();
        }).catch(() => {});
      }
    } catch (error) {
      document.body.innerHTML = '<div class="err"><div><b>账本加载失败</b><div style="margin-top:8px;color:#9aa3af">' + esc(error.message) + '</div><pre>' + esc(error.stack || '') + '</pre></div></div>';
    }
  }

  boot();
})();
</script>
<script src="assets/xlsx.full.min.js"></script>
</body>
