// 玻璃微调面板（2026-09-30 S3 · 自 pt-audio-toolkit glass-tuner.js 去桥移植）
// 四旋钮三开关全走 <html> inline 变量实时生效；workspaceStorage 即时存（300ms 防抖），
// 「记住」立即落盘。桌面版保存到独立工作区文件，单独网页版使用浏览器存储。
// 材质参数统一接到功能层语义变量；低透明模式保留参数并明确提示。
// ═══════════════════════════════════════════════════════
(function () {
  "use strict";
  var LS_KEY = "settlement-glass-tuner";
  var DOC = document.documentElement;

  // 液态功能层默认值；旧参数仅迁移视觉设置，不影响业务记录。
  var DEF = {
    blur: 6,            // px，局部材质最多8px
    radius: 22,         // px，始终保留圆角
    blob: 1.0,          // 光斑浓度倍率
    hl: 1,              // 高光边
    shadow: 1,          // 投影
    bars: 1,            // 受控区域透明
    alphaLight: 0.82,   // 浅色功能层不透明度
    alphaDark: 0.82,    // 深色功能层不透明度
    schema: 2
  };
  var DARK_THEMES = { dark: 1, warm: 1, ocean: 1 };
  function isDark() { return !!DARK_THEMES[DOC.dataset.theme || ""]; }

  var st = loadLocal();
  var ui = null;
  var saveTimer = null;

  function loadLocal() {
    var d = JSON.parse(JSON.stringify(DEF));
    try {
      var raw = workspaceStorage.getItem(LS_KEY);
      if (raw) {
        var o = JSON.parse(raw);
        for (var k in d) { if (o[k] !== undefined) { d[k] = o[k]; } }
      }
    } catch (e) { /* 损坏就当没有 */ }
    // 旧卡片参数迁移为功能层参数；限幅避免旧值恢复直角或高开销模糊。
    function bound(value, min, max, fallback) { return Number.isFinite(Number(value)) ? Math.max(min,Math.min(max,Number(value))) : fallback; }
    d.blur=bound(d.blur,0,8,DEF.blur);d.radius=bound(d.radius,16,28,DEF.radius);d.blob=bound(d.blob,0,2,DEF.blob);
    for(var key of ['alphaLight','alphaDark']) d[key]=bound(d[key]<.55 ? DEF[key] : d[key],.55,.98,DEF[key]);
    for(var key of ['hl','shadow','bars']) d[key]=d[key] ? 1 : 0;
    d.schema=2;
    return d;
  }
  function saveLocal() {
    if(workspaceBootError)return false;
    try { workspaceStorage.setItem(LS_KEY, JSON.stringify(st));saveSettings(settings);return true; } catch (e) {return false;}
  }
  function materialRoots(){return [DOC];}
  function set(k, v) { materialRoots().forEach(node=>node.style.setProperty(k,v)); }
  function rm(k) { materialRoots().forEach(node=>node.style.removeProperty(k));DOC.style.removeProperty(k); }

  function apply() {
    var dark = isDark(), a = dark ? st.alphaDark : st.alphaLight;
    settings.topOpacity=a;
    set("--material-opacity", Math.round(a*100)+"%");
    set("--glass-blur", st.blur + "px");
    set("--material-radius", st.radius + "px");
    set("--blob-opacity", st.blob);
    set("--material-glow-primary", st.blob*12+"%");
    set("--material-glow-secondary", st.blob*10+"%");

    set("--material-shine", st.hl ? (dark ? "rgba(255,255,255,.28)" : "rgba(255,255,255,.86)") : "transparent");
    set("--material-edge", st.hl ? (dark ? "rgba(210,220,235,.16)" : "rgba(118,102,78,.19)") : "transparent");
    set("--material-shadow", st.shadow ? "inset 0 1px 0 var(--material-shine),inset 0 -1px 0 var(--material-shade),0 8px 24px rgba(0,0,0,.12)" : "none");
    document.body.classList.toggle('glass-solid-header',!st.bars);
  }
  function clearAll() {
    ["--glass-alpha","--glass-blur","--material-opacity","--material-radius","--blob-opacity","--material-glow-primary","--material-glow-secondary","--material-shine","--material-edge","--material-shadow"].forEach(rm);
    document.body.classList.remove('glass-solid-header');
  }

  var HTML = ""
    + "<div class='gt-head' id='gtDrag'><b>🎛 玻璃微调</b><span class='gt-close' id='gtClose' title='收起'>✕</span></div>"
    + "<div class='gt-body'><p class='gt-note' id='gtStatus'></p><button type='button' class='btn secondary' id='gtEnableMaterial'>开启玻璃效果</button>"
    + "<label class='gt-row'>材质不透明度（越低越通透）<span class='gt-val' id='vAlpha'></span>"
    + "<input type='range' id='rAlpha' min='0.55' max='0.98' step='0.01'></label>"
    + "<label class='gt-row'>模糊强度（背后糊多少）<span class='gt-val' id='vBlur'></span>"
    + "<input type='range' id='rBlur' min='0' max='8' step='1'></label>"
    + "<label class='gt-row'>受控区域圆角（含日历信息面板）<span class='gt-val' id='vRadius'></span>"
    + "<input type='range' id='rRadius' min='16' max='28' step='1'></label>"
    + "<label class='gt-row'>光斑浓度（背景彩光多明显）<span class='gt-val' id='vBlob'></span>"
    + "<input type='range' id='rBlob' min='0' max='2' step='0.05'></label>"
    + "<div class='gt-switches'>"
    + "<label><input type='checkbox' id='cHl'> 高光边</label>"
    + "<label><input type='checkbox' id='cShadow'> 投影</label>"
    + "<label><input type='checkbox' id='cBars'> 受控区域透明</label>"
    + "</div>"
    + "<div class='gt-actions'>"
    + "<button id='gtRemember' class='gt-pri'>记住</button>"
    + "<button id='gtCopy'>复制参数</button>"
    + "<button id='gtReset'>恢复默认</button>"
    + "</div>"
    + "<div class='gt-note'>导航材质与圆角实时生效，浅/深不透明度分别保存。滚动后的透明度在顶部工作区设置；当前主题为<b id='gtMode'>浅色</b>；「记住」自动保存到本机工作区。</div>"
    + "</div>";

  function build() {
    var panel = document.createElement("div");
    panel.className = "gt-panel";
    panel.id = "gtPanel";

    document.body.appendChild(panel);

    panel.querySelector("#gtClose").onclick = function () { panel.classList.remove("open"); };

      settings.topOpacity=st[isDark()?"alphaDark":"alphaLight"];saveSettings(settings);
      onTick();
    };
    panel.querySelector("#rBlur").oninput = function (e) { st.blur = parseFloat(e.target.value); onTick(); };
    panel.querySelector("#rRadius").oninput = function (e) { st.radius = parseFloat(e.target.value); onTick(); };
    panel.querySelector("#rBlob").oninput = function (e) { st.blob = parseFloat(e.target.value); onTick(); };
    panel.querySelector("#cHl").onchange = function (e) { st.hl = e.target.checked ? 1 : 0; onTick(); };
    panel.querySelector("#cShadow").onchange = function (e) { st.shadow = e.target.checked ? 1 : 0; onTick(); };
    panel.querySelector("#cBars").onchange = function (e) { st.bars = e.target.checked ? 1 : 0; onTick(); };

    ui = panel;
    syncUI();
  }

  function onTick() { apply(); saveLocalDebounced(); syncVals(); }
  function saveLocalDebounced() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(saveLocal, 300);
  }
  function flash(el, txt) {
    var old = el.textContent;
    el.textContent = txt;
    setTimeout(function () { el.textContent = old; }, 1200);
  }
  function copyParams(el) {
    var txt = JSON.stringify(st, null, 2);
    function fb() {
      try {
        var ta = document.createElement("textarea");
        ta.value = txt; document.body.appendChild(ta); ta.select();
        document.execCommand("copy"); document.body.removeChild(ta);
        flash(el, "已复制 ✓");
      } catch (e) { flash(el, "复制失败"); }
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt).then(function () { flash(el, "已复制 ✓"); }, fb);
    } else { fb(); }
  }
  function drag(box, handle) {
    var sx = 0, sy = 0, bx = 0, by = 0, on = false;
    function down(e) {
      on = true; sx = e.clientX; sy = e.clientY;
      var r = box.getBoundingClientRect(); bx = r.left; by = r.top;
      box.style.right = "auto"; box.style.bottom = "auto";
      box.style.left = bx + "px"; box.style.top = by + "px";
      e.preventDefault();
    }
    function move(e) {
      if (!on) { return; }
      box.style.left = (bx + e.clientX - sx) + "px";
      box.style.top = (by + e.clientY - sy) + "px";
    }
    function up() { on = false; }
    handle.addEventListener("mousedown", down);
    window.addEventListener("mousemove", move);
    window.addEventListener("mouseup", up);
  }

  function syncVals() {
    if (!ui) { return; }
    var reduced=!!settings.materialReduced;
    ui.querySelector('#gtStatus').textContent=reduced ? '已开启降低透明效果：通透、模糊参数暂不显示；开启玻璃效果后可预览。' : '控制冻结区域、分组和弹窗背景；文字保持清晰。';
    ui.querySelector('#gtEnableMaterial').hidden=!reduced;
    var a = isDark() ? st.alphaDark : st.alphaLight;
    document.querySelectorAll('[id$="TopOpacity"]').forEach(el=>{el.value=a;if(el.nextElementSibling)el.nextElementSibling.textContent=Math.round(a*100)+'%';});
    ui.querySelector("#vAlpha").textContent = Number(a).toFixed(2);
    ui.querySelector("#vBlur").textContent = st.blur + "px";
    ui.querySelector("#vRadius").textContent = st.radius + "px";
    ui.querySelector("#vBlob").textContent = Math.round(st.blob * 100) + "%";
  }
  function syncUI() {
    if (!ui) { return; }
    var dark = isDark();
    ui.querySelector("#rAlpha").value = dark ? st.alphaDark : st.alphaLight;
    ui.querySelector("#rBlur").value = st.blur;
    ui.querySelector("#rRadius").value = st.radius;
    ui.querySelector("#rBlob").value = st.blob;
    ui.querySelector("#cHl").checked = !!st.hl;
    ui.querySelector("#cShadow").checked = !!st.shadow;
    ui.querySelector("#cBars").checked = !!st.bars;
    ui.querySelector("#gtMode").textContent = dark ? "深色" : "浅色";
    syncVals();
  }

  function refresh() {
    var glass = DOC.dataset.style === "glass";
    document.body.classList.toggle("gt-on", glass);
    if (glass) { apply(); } else { clearAll(); }
    if (ui) {
      syncUI();
      if (!glass) { ui.classList.remove("open"); }
    }
  }

  build();
  window.refreshGlassTuner=syncVals;
  window.setOverviewOpacity=function(value){st[isDark()?"alphaDark":"alphaLight"]=Math.max(.55,Math.min(.98,Number(value)||.82));apply();syncUI();saveLocal();};
  window.reloadGlassPreferences=function(){clearTimeout(saveTimer);saveTimer=null;st=loadLocal();refresh();};
  window.flushGlassPreferences=function(){if(saveTimer!==null){clearTimeout(saveTimer);saveTimer=null;if(saveLocal()===false)throw new Error('当前玻璃参数保存失败');}};
  refresh();
  new MutationObserver(refresh).observe(DOC, {
    attributes: true, attributeFilter: ["data-style", "data-theme"]
  });
  if (location.hash === "#gt-open" && ui) { ui.classList.add("open"); }   /* 调试/截图深链 */
})();
// 迁移旧主题键 settlement-theme → settings.theme
try {
  const old = workspaceStorage.getItem('settlement-theme');
  if (old !== null && !settings.theme) { settings.theme = old; saveSettings(settings); }
} catch(e) {}
// URL 测试通道：?theme=dark&style=glass 可直接预览任意组合（截图/验收用，日常无感）
const _qs = new URLSearchParams(location.search);
if (_qs.get('theme') !== null) settings.theme = _qs.get('theme');
if (_qs.get('style') !== null) settings.style = _qs.get('style');
// 已移除的旧主题迁移到现行主题，不改变业务数据或存储路径。
settings.theme=normalizeTheme(settings.theme);
settings.style='glass';
document.body.classList.toggle('reduce-material',!!settings.materialReduced);
document.body.classList.toggle('allow-material',!settings.materialReduced);
settings.favoriteThemes=[...new Set((settings.favoriteThemes||[]).map(normalizeTheme))];
saveSettings(settings);
document.documentElement.setAttribute('data-theme',settings.theme);
document.documentElement.setAttribute('data-style', settings.style || 'glass');

// 拖拽只改变布局，业务数据与固定存储入口不变。
function applySideWidths(){
 const widths=settings.sideWidths||{},clamp=(n,lo,hi)=>Math.max(lo,Math.min(hi,n));
 let left=clamp(Number(widths.left)||224,180,420),right=clamp(Number(widths.right)||300,240,560);
 const area=document.getElementById('workArea'),available=area?.clientWidth||innerWidth/(settings.layoutZoom||1)-24;
 const both=typeof guiPanelMode!=='function'||guiPanelMode('left')==='dock'&&guiPanelMode('right')==='dock';
 if(available>=756&&both){const extra=Math.max(0,available-320-180-240),requested=left-180+right-240;if(requested>extra){const ratio=extra/(requested||1);left=180+(left-180)*ratio;right=240+(right-240)*ratio;}}
 for(const [side,value] of [['left',left],['right',right]]){document.documentElement.style.setProperty('--'+side+'-width',Math.round(value)+'px');document.getElementById(side+'Splitter')?.setAttribute('aria-valuenow',String(Math.round(value)));}
}
function setSideWidth(side,width){
 const otherSide=side==='left'?'right':'left',zoom=settings.layoutZoom||1;
 const other=typeof guiPanelMode==='function'&&guiPanelMode(otherSide)==='float'?0:document.getElementById(otherSide+'Panel').getBoundingClientRect().width/zoom;
 const min=side==='left'?180:240,max=side==='left'?420:560,limit=Math.max(min,Math.min(max,document.getElementById('workArea').clientWidth-other-320));
 settings.sideWidths={...settings.sideWidths,[side]:Math.round(Math.max(min,Math.min(limit,width)))};applySideWidths();
}
for(const side of ['left','right']){
 const handle=document.createElement('div');handle.id=side+'Splitter';handle.className='side-resize';handle.tabIndex=0;handle.setAttribute('role','separator');handle.setAttribute('aria-orientation','vertical');handle.setAttribute('aria-controls',side+'Panel');handle.setAttribute('aria-valuemin',side==='left'?'180':'240');handle.setAttribute('aria-valuemax',side==='left'?'420':'560');handle.setAttribute('aria-label',side==='left'?'调整导航宽度':'调整筛选宽度');handle.title='拖拽调宽；双击恢复默认；方向键微调';document.getElementById(side+'Panel').appendChild(handle);
 handle.addEventListener('pointerdown',event=>{
  if(event.button!==0||innerWidth/(settings.layoutZoom||1)<780)return;event.preventDefault();handle.setPointerCapture(event.pointerId);
  const zoom=settings.layoutZoom||1,x=event.clientX,start=document.getElementById(side+'Panel').getBoundingClientRect().width/zoom;document.body.classList.add('resizing-side');
  const move=e=>setSideWidth(side,start+(e.clientX-x)/zoom*(side==='left'?1:-1));
  const stop=()=>{handle.removeEventListener('pointermove',move);handle.removeEventListener('pointerup',stop);handle.removeEventListener('pointercancel',stop);document.body.classList.remove('resizing-side');saveSettings(settings);};
  handle.addEventListener('pointermove',move);handle.addEventListener('pointerup',stop);handle.addEventListener('pointercancel',stop);
 });
 handle.addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight','Home'].includes(e.key))return;e.preventDefault();setSideWidth(side,e.key==='Home'?(side==='left'?224:300):document.getElementById(side+'Panel').getBoundingClientRect().width/(settings.layoutZoom||1)+(e.key==='ArrowRight'?12:-12)*(side==='left'?1:-1));saveSettings(settings);});
 handle.addEventListener('dblclick',()=>{setSideWidth(side,side==='left'?224:300);saveSettings(settings);});
}
document.getElementById('modalBox').addEventListener('pointerdown',event=>{
 const modal=event.currentTarget,title=event.target.closest('h2');if(event.button!==0||title?.parentElement!==modal)return;
 event.preventDefault();title.setPointerCapture(event.pointerId);const initial=modal.getBoundingClientRect(),x=event.clientX,y=event.clientY;document.body.classList.add('dragging-modal');
 const matrix=new DOMMatrix(getComputedStyle(modal).transform),tx=matrix.m41,ty=matrix.m42;
 const move=e=>{const dx=Math.max(8-initial.left,Math.min(innerWidth-8-initial.right,e.clientX-x));const dy=Math.max(8-initial.top,Math.min(Math.max(8,innerHeight-48)-initial.top,e.clientY-y));const zoom=settings.layoutZoom||1;modal.style.transform=`translate(${tx+dx/zoom}px,${ty+dy/zoom}px)`;};
 const stop=()=>{title.removeEventListener('pointermove',move);title.removeEventListener('pointerup',stop);title.removeEventListener('pointercancel',stop);document.body.classList.remove('dragging-modal');};
 title.addEventListener('pointermove',move);title.addEventListener('pointerup',stop);title.addEventListener('pointercancel',stop);
});
applySideWidths();

render();
/* 4.6 启动握手：首帧后主动报到，后端据此跳过早帧像素探针（收不到才回落到探针） */
(function () {
  let sent = false;
  function signal() {
    if (sent) return;
    const api = window.pywebview && window.pywebview.api;
    if (!api || typeof api.pageReady !== 'function') return;
    sent = true;
    try { api.pageReady(); } catch (e) {}
  }
  requestAnimationFrame(() => requestAnimationFrame(() => setTimeout(signal, 0)));
  window.addEventListener('pywebviewready', () => setTimeout(signal, 0));
})();
