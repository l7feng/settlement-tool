<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/x-icon" href="assets/icons/app.ico">
<title>制作结算台</title>
<!-- 依赖本地化：assets/ 与 html 同目录即可离线工作（exe 打包时随行） -->
<script src="assets/desktop-workspace.js"></script>
<script src="assets/version.js"></script>
<script src="assets/demo-fixture.js"></script>
<style>
:root {
  --main: #8A6A45; --main-l: #F5EFE6; --band: #FAF6F0; --white: #FFFFFF;
  --sum-bg: #F2EAE0; --input: #FDFBF3; --line: #E2D8CC; --text: #3A322A;
  --muted: #8A7A68; --accent: #A87C4A; --section: #F2EAE0; --danger: #B5544A;
  --bg: #FBF8F4; --header-bg: #8A6A45; --header-fg: #fff;
  --sel: rgba(138,106,69,.08);
  /* 玻璃参量（2026-09-30 S1 · 对齐 pt H版口径；只有 glass 档消费） */
  --glass-alpha: 0.55; --glass-edge: 0.9;
  --glass-shadow: 0 4px 14px rgba(0,0,0,0.12);
  --backdrop: #EFE6D8;
  --blob1: rgba(138,106,69,0.25); --blob2: rgba(168,124,74,0.20); --blob3: rgba(200,170,130,0.22);
}
[data-theme="dark"] {
  --main: #5B8A92;
  --main-l: #2A3A3E;
  --band: #1E2A2D;
  --white: #263338;
  --sum-bg: #2F4248;
  --input: #2E3A2E;
  --line: #3A4A4E;
  --text: #D8E2E4;
  --muted: #8AA0A4;
  --accent: #C8956C;
  --section: #2A3A3E;
  --danger: #D4706A;
  --bg: #1A2427;
  --header-bg: #2A3A3E;
  --header-fg: #D8E2E4;
  --sel: rgba(255,255,255,.05);
  --glass-alpha: 0.08; --glass-edge: 0.16;
  --glass-shadow: 0 6px 18px rgba(0,0,0,0.40);
  --backdrop: #162023;
  --blob1: rgba(91,138,146,0.20); --blob2: rgba(200,149,108,0.14); --blob3: rgba(80,120,130,0.16);
}
/* 米纸暖（浅）· 2026-09-30 S1 对齐 7F 色彩真源：
   --main = 焙茶橘 #9C4A2E（7F 记忆色深版，白字 ≈5:1）；--accent = 陶土中间调
   （记忆色 #E07A52 与深版之间，大数字可读）；淡染底 = 杏白 #FBEFE9（7F 真源）。 */

[data-theme="warm"] {
  --main: #B08050; --main-l: #3A2E24; --band: #2E251E; --white: #33291F;
  --sum-bg: #4A3A2C; --input: #3A2F24; --line: #4A3C2E; --text: #EBDCC8;
  --muted: #B39C82; --accent: #D9A441; --section: #3A2E24; --danger: #D4706A;
  --bg: #241D16; --header-bg: #3A2E24; --header-fg: #EBDCC8;
  --sel: rgba(255,255,255,.05);
  --glass-alpha: 0.08; --glass-edge: 0.16;
  --glass-shadow: 0 6px 18px rgba(0,0,0,0.40);
  --backdrop: #1E1812;
  --blob1: rgba(217,164,65,0.16); --blob2: rgba(176,128,80,0.14); --blob3: rgba(120,90,60,0.12);
}
[data-theme="ocean"] {
  --main: #4F7EA8; --main-l: #26333F; --band: #1E2833; --white: #263242;
  --sum-bg: #2E4256; --input: #243244; --line: #35485C; --text: #D6E2EE;
  --muted: #8FA6BC; --accent: #E0A458; --section: #26333F; --danger: #D4706A;
  --bg: #172029; --header-bg: #26333F; --header-fg: #D6E2EE;
  --sel: rgba(255,255,255,.05);
  --glass-alpha: 0.08; --glass-edge: 0.16;
  --glass-shadow: 0 6px 18px rgba(0,0,0,0.40);
  --backdrop: #131B23;
  --blob1: rgba(79,126,168,0.20); --blob2: rgba(224,164,88,0.14); --blob3: rgba(70,110,150,0.16);
}


/* 工作类型与计价方式配色：混音/重混/修改、按集/按时长各用可辨颜色，调淡重混与修改饱和度。 */
:root{
  --work-mix:var(--main); --work-revise:#C47A2B; --work-remix:#7E6BBF;
  --mode-episode:var(--main); --mode-duration:#0F7A72; --mode-mixed:#7A6A55;
}
[data-theme="dark"]{--work-revise:#E0A86C;--work-remix:#B3A5EE;--mode-duration:#5FBFB4;--mode-mixed:#9AA6B2}
[data-theme="claude"]{--work-revise:#C47A2B;--work-remix:#7E6BBF;--mode-duration:#0F7A72;--mode-mixed:#8A7358}
[data-theme="warm"]{--work-revise:#DF9D4E;--work-remix:#A693DE;--mode-duration:#4FB3A6;--mode-mixed:#B6A088}
[data-theme="ocean"]{--work-revise:#D89E62;--work-remix:#9EACE3;--mode-duration:#5FBFB4;--mode-mixed:#8FA6BC}
:root:is([data-theme="forest"],[data-theme="violet"]){--work-revise:#D89E62;--work-remix:#B3A5EE;--mode-duration:#5FBFB4;--mode-mixed:#9AA6B2}
.work-mix{color:var(--work-mix)} .work-revise{color:var(--work-revise)} .work-remix{color:var(--work-remix)}
.cal-line-mix{color:var(--work-mix)} .cal-line-revise{color:var(--work-revise)} .cal-line-remix{color:var(--work-remix)}
#calendarHover .calendar-work-group h4.work-mix{color:var(--work-mix)}
#calendarHover .calendar-work-group h4.work-revise{color:var(--work-revise)}
#calendarHover .calendar-work-group h4.work-remix{color:var(--work-remix)}
#calendarHover .calendar-work-card b.work-revise{color:var(--work-revise)}
#calendarHover .calendar-work-card b.work-remix{color:var(--work-remix)}
.project-group.mode-episode>.month-header{border-left:3px solid var(--mode-episode)!important}
.project-group.mode-duration>.month-header{border-left:3px solid var(--mode-duration)!important}
.project-group.mode-mixed>.month-header{border-left:3px solid var(--mode-mixed)!important}
.project-group.mode-episode>.month-header .mode-tag{color:var(--mode-episode)}
.project-group.mode-duration>.month-header .mode-tag{color:var(--mode-duration)}
.project-group.mode-mixed>.month-header .mode-tag{color:var(--mode-mixed)}
.mode-tag{border:1px solid currentColor;border-radius:6px;padding:0 5px;margin-left:6px;font-size:11px;white-space:nowrap;opacity:.9}
.duplicate-flag{color:var(--danger);font-size:11px;margin-left:4px}
#finalCutDropZone.over{border-color:var(--main);background:color-mix(in srgb,var(--main) 10%,var(--bg) 90%)}

/* 统一玻璃风格，输入与弹窗保持可读表面。 */
:root[data-style="glass"] {
  --radius: 14px; --radius-sm: 8px; --btn-radius: 14px;
  --card-bg: rgba(255,255,255,var(--glass-alpha, 0.55));
  --card-border: 1px solid rgba(255,255,255,var(--glass-edge, 0.9));
  --card-shadow: var(--glass-shadow, 0 4px 14px rgba(0,0,0,0.12));
  --glass-blob-display: block;
  --glass-blur: 10px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: "Microsoft YaHei", "微软雅黑", sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  line-height: 1.5;
  transition: background .2s, color .2s;
}
:root[data-style="glass"] body { background: var(--backdrop); }
/* ── 背景光斑（玻璃档的主要氛围来源；pixel 档隐藏）── */
.blob { display: var(--glass-blob-display, none); opacity: var(--blob-opacity, 1);
  position: fixed; border-radius: 50%;
  filter: blur(42px); pointer-events: none; z-index: 0; }
.blob.b1 { width: 240px; height: 240px; top: 6%; left: 4%; background: var(--blob1); }
.blob.b2 { width: 200px; height: 200px; top: 40%; right: 2%; background: var(--blob2); }
.blob.b3 { width: 220px; height: 220px; bottom: -6%; left: 30%; background: var(--blob3); }
/* ── 顶栏 ── */
.topbar {
  background: var(--main);
  color: #fff;
  padding: 12px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky; top: 0; z-index: 100;
}
.topbar h1 { font-size: 18px; font-weight: 600; display:flex; align-items:center; gap:9px; }
.topbar .brand-mark { height:34px; width:auto; flex:0 0 auto; }
.topbar .right { display: flex; align-items: center; gap: 10px; }
.topbar label { font-size: 13px; opacity: .85; }
.topbar select {
  background: rgba(255,255,255,.15);
  color: #fff; border: 1px solid rgba(255,255,255,.3);
  padding: 4px 8px; border-radius: var(--radius-sm); font-size: 13px;
}
.topbar select option { color: var(--text); }
/* ── 底部状态栏 ── */
.statusbar { flex: 0 0 auto; display: flex; justify-content: flex-end; align-items: center; gap: 10px; padding: 5px 16px; font-size: 11.5px; color: var(--muted); }
.status-version { font-variant-numeric: tabular-nums; white-space: nowrap; }
/* ── 卡片 ── */
.cards {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 14px;
  padding: 16px 20px 8px;
  position: relative; z-index: 1;
}
.card {
  background: var(--card-bg);
  border: var(--card-border);
  border-radius: var(--radius);
  box-shadow: var(--card-shadow);
  padding: 14px 18px;
  position: relative;
}
:root[data-style="glass"] .card,
:root[data-style="glass"] .modal {
  backdrop-filter: blur(var(--glass-blur, 10px));
  -webkit-backdrop-filter: blur(var(--glass-blur, 10px));
}
.card .label { font-size: 12px; color: var(--muted); }
.card .value { font-size: 26px; font-weight: 700; color: var(--accent); margin-top: 2px; font-variant-numeric: tabular-nums; }
/* ── 工具栏 ── */
.toolbar {
  padding: 10px 20px;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
  position: relative; z-index: 1;
}
.btn {
  background: var(--main);
  color: #fff;
  border: 1px solid rgba(0,0,0,.22);
  padding: 7px 14px;
  border-radius: var(--btn-radius);
  cursor: pointer;
  font-size: 13px;
  font-family: inherit;
  transition: filter .15s, transform .05s, background .15s;
}
.btn:hover { filter: brightness(1.08); }
.btn:active { transform: translateY(1px); }
.btn.secondary { background: var(--white); color: var(--main); border: 1px solid var(--line); }
.btn.accent { background: var(--accent); }
.btn.danger { background: var(--danger); }
/* ── tab ── */
.tabs {
  padding: 0 20px;
  display: flex;
  gap: 4px;
  border-bottom: 2px solid var(--line);
  position: relative; z-index: 1;
}
.tab {
  padding: 8px 16px;
  cursor: pointer;
  font-size: 13px;
  color: var(--muted);
  border-bottom: 2px solid transparent;
  margin-bottom: -2px;
}
.tab.active { color: var(--main); border-bottom-color: var(--main); font-weight: 600; }
/* ── 主内容 ── */
.content { padding: 14px 20px 40px; position: relative; z-index: 1; }
.view { display: none; }
.view.active { display: block; }
/* ── 表格 ── */
table {
  width: 100%;
  border-collapse: collapse;
  background: var(--white);
  font-size: 13px;
  font-variant-numeric: tabular-nums;   /* 金额/时长列上下对齐 */
}
th, td {
  padding: 8px 10px;
  text-align: center;
  border-bottom: 1px solid var(--line);
}
th {
  background: var(--main);
  color: #fff;
  font-weight: 600;
  position: sticky; top: 0;
}
td.l, th.l { text-align: left; }
td.r, th.r { text-align: right; }
tr:nth-child(even) td { background: var(--band); }
tr:hover td { background: var(--sel); }
tr.subtotal td { background: var(--sum-bg); font-weight: 600; color: var(--main); }
tr.grand td { background: var(--main); color: #fff; font-weight: 700; font-size: 14px; }
/* ── 行内删除：默认很淡，悬停才清晰（设置里可开关） ── */
.btn-del-x {
  background: transparent; border: none; color: var(--muted);
  font-size: 15px; line-height: 1; padding: 0 6px; cursor: pointer;
  opacity: .28; transition: opacity .15s, color .15s;
}
tr:hover .btn-del-x { opacity: .8; }
.btn-del-x:hover { opacity: 1; color: var(--danger); }
body.del-hover .btn-del-x { visibility: hidden; }
body.del-hover tr:hover .btn-del-x { visibility: visible; }
/* ── 删除模式下的醒目红色删除符 ── */
.btn-del-red {
  background: var(--danger); color: #fff; border: none;
  border-radius: var(--radius-sm); padding: 2px 8px; font-size: 12px;
  cursor: pointer; font-family: inherit; line-height: 1.4;
}
.btn-del-red:hover { opacity: .85; }
/* ── 行内编辑 ── */
.btn-edit {
  background: transparent; border: none; color: var(--muted);
  font-size: 13px; padding: 0 5px; cursor: pointer; opacity: .3;
  transition: opacity .15s, color .15s;
}
tr:hover .btn-edit { opacity: .8; }
.btn-edit:hover { opacity: 1; color: var(--main); }
/* ── 月度折叠 ── */
.month-group { margin-bottom: 6px; position: relative; z-index: 1; }
.month-header {
  background: var(--section);
  padding: 10px 14px;
  cursor: pointer;
  font-weight: 600;
  color: var(--main);
  border-left: 3px solid var(--main);
  display: flex;
  justify-content: space-between;
  align-items: center;
  user-select: none;
}
.month-header:hover { background: var(--main-l); }
.month-header .stat { font-weight: 400; color: var(--muted); font-size: 12px; }
.month-header .toggle { margin-right: 8px; }
.month-body { display: block; }
.month-group.collapsed .month-body { display: none; }
/* ── 全部合计 ── */
.grand-total {
  display: flex; gap: 20px; flex-wrap: wrap; align-items: baseline;
  background: var(--main); color: #fff;
  padding: 10px 16px; border-radius: var(--radius-sm); margin-bottom: 10px;
  font-size: 13px;
}
.grand-total .gt-item b { font-size: 16px; margin: 0 2px; font-variant-numeric: tabular-nums; }
/* ── 筛选栏 ── */
.filter-bar {
  padding: 8px 20px;
  display: flex;
  gap: 10px;
  align-items: center;
  font-size: 13px;
  color: var(--muted);
}
.filter-bar select {
  padding: 4px 8px;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  font-family: inherit;
}
/* ── 拖拽区 ── */
.drop-zone {
  margin: 10px 20px;
  border: 2px dashed var(--line);
  border-radius: var(--radius-sm);
  padding: 20px;
  text-align: center;
  color: var(--muted);
  font-size: 13px;
  transition: all .2s;
  position: relative; z-index: 1;
}
.drop-zone.dragover {
  border-color: var(--main);
  background: var(--main-l);
  color: var(--main);
}
/* ── 弹窗 ── */
.modal-mask {
  display: none;
  position: fixed; inset: 0;
  background: rgba(0,0,0,.35);
  z-index: 200;
  justify-content: center;
  align-items: flex-start;
  padding-top: 60px;
}
.modal-mask.show { display: flex; }
.modal {
  background: var(--card-bg);
  border: var(--card-border);
  border-radius: var(--radius);
  padding: 22px;
  width: 460px;
  max-height: 80vh;
  overflow-y: auto;
  box-shadow: 0 16px 44px rgba(0,0,0,.30);
}
.modal h2 { font-size: 16px; color: var(--main); margin-bottom: 16px; }
.form-row {
  display: flex;
  align-items: center;
  margin-bottom: 10px;
  gap: 8px;
}
.form-row label { width: 80px; text-align: right; font-size: 13px; color: var(--muted); flex-shrink: 0; }
.form-row input, .form-row select {
  flex: 1;
  padding: 6px 8px;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  font-family: inherit;
  font-size: 13px;
}
.form-row input:focus, .form-row select:focus { outline: none; border-color: var(--main); }
.modal-actions {
  margin-top: 18px;
  display: flex;
  justify-content: flex-end;
  gap: 8px;
}
/* ── 日历 ── */
.cal-nav {
  display: flex; justify-content: center; align-items: center;
  gap: 16px; padding: 10px 0;
}
.cal-nav button {
  background: var(--white); border: 1px solid var(--line);
  padding: 4px 12px; border-radius: var(--radius-sm); cursor: pointer;
  font-family: inherit;
}
.cal-nav .cal-title { font-size: 15px; font-weight: 600; color: var(--main); }
.cal-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 4px;
  margin-bottom: 16px;
}
.cal-cell {
  background: var(--white);
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  min-height: 92px;
  padding: 6px;
  font-size: 12px;
  cursor: pointer;
  transition: all .15s;
  display: flex;
  flex-direction: column;
}
.cal-cell:hover { border-color: var(--main); }
.cal-cell.empty { background: var(--band); opacity: .5; cursor: default; }
.cal-cell.today { border-color: var(--accent); border-width: 2px; }
.cal-cell.selected { background: var(--main-l); border-color: var(--main); border-width: 2px; }
.cal-cell .dow { font-weight: 700; color: var(--text); font-size: 12px; }
.cal-cell .eplist { flex:1; color: var(--main); font-size: 10.5px; line-height:1.35; margin-top:2px; word-break:break-all; overflow:hidden; }
.cal-cell .cellfoot { margin-top:auto; padding-top:2px; font-size:10.5px; display:flex; justify-content:space-between; }
.cal-cell .count { color: color-mix(in srgb, var(--accent) 58%, var(--muted) 42%); font-weight: 600; }
.cal-cell .fee { color: var(--muted); }
/* 日历配色调淡：窗格内的类型色、今日与选中态统一降低饱和度，避免整块日历过艳。 */
.cal-cell .eplist { opacity: .9; }
.cal-cell .eplist .cal-line-mix { color: color-mix(in srgb, var(--work-mix) 70%, var(--muted) 30%); }
.cal-cell .eplist .cal-line-remix { color: color-mix(in srgb, var(--work-remix) 66%, var(--muted) 34%); }
.cal-cell.today { border-color: color-mix(in srgb, var(--accent) 52%, var(--line) 48%); border-width: 1.5px; }
.cal-cell.selected { background: color-mix(in srgb, var(--main-l) 52%, var(--white) 48%); border-color: color-mix(in srgb, var(--main) 48%, var(--line) 52%); border-width: 1.5px; }
#calendarHover .calendar-work-group h4.work-mix, #calendarHover .calendar-work-card b.work-mix { color: color-mix(in srgb, var(--work-mix) 72%, var(--muted) 28%); }
#calendarHover .calendar-work-group h4.work-remix, #calendarHover .calendar-work-card b.work-remix { color: color-mix(in srgb, var(--work-remix) 68%, var(--muted) 32%); }
#calendarHover .calendar-work-group h4.work-revise, #calendarHover .calendar-work-card b.work-revise { color: color-mix(in srgb, var(--work-revise) 70%, var(--muted) 30%); }
.cal-dow-header {
  display: grid; grid-template-columns: repeat(7, 1fr);
  text-align: center; font-size: 12px; color: var(--muted);
  padding-bottom: 4px;
}

/* ── 空态（S2）── */
.empty-state {
  padding: 48px 20px;
  text-align: center;
  color: var(--muted);
  font-size: 13px;
  line-height: 2;
  background: var(--card-bg);
  border: 2px dashed var(--line);
  border-radius: var(--radius);
}
.empty-state b { color: var(--main); }
/* ── toast ── */
.toast {
  position: fixed;
  bottom: 30px; left: 50%;
  transform: translateX(-50%);
  background: var(--main);
  color: #fff;
  padding: 10px 22px;
  border-radius: var(--radius-sm);
  font-size: 13px;
  z-index: 300;
  opacity: 0;
  transition: opacity .3s;
  pointer-events: none;
}
.toast.show { opacity: 1; }
/* ── 小屏 ── */
@media (max-width: 700px) {
  .cards { grid-template-columns: 1fr; }
  .topbar { flex-direction: column; gap: 8px; }
  table { font-size: 12px; }
  th, td { padding: 5px 6px; }
}

/* ═══ 玻璃微调面板（2026-09-30 S3 · 自 pt glass-tuner.js 去桥移植）═══ */
.gt-btn { display:none; align-items:center; gap:6px; font-size:12px; color:#fff; cursor:pointer;
  border:1px solid rgba(255,255,255,.3); border-radius:var(--btn-radius); padding:5px 10px;
  background:rgba(255,255,255,.15); user-select:none; }
.gt-btn:hover { background:rgba(255,255,255,.25); }
body.gt-on .gt-btn { display:inline-flex; }
.gt-panel { display:none; position:fixed; top:64px; right:14px; z-index:250; width:280px;
  background:var(--white); border:1px solid var(--line); border-radius:var(--radius-sm);
  box-shadow:0 10px 34px rgba(0,0,0,0.22); overflow:hidden; }
body.gt-on .gt-panel.open { display:block; }

<script>
// ═══════════════════════════════════════════════════════
// 数据层与多工作台支持
// ═══════════════════════════════════════════════════════
const APP_VERSION = window.SETTLEMENT_VERSION || '0.0.0';   // 单一来源：assets/version.js（由 VERSION 生成）
document.getElementById('statusVersion').textContent = '制作结算台 | v' + APP_VERSION;
let activeProfileId = (function(){
  try { return workspaceStorage.getItem('settlement_active_profile') || 'default'; } catch(_) { return 'default'; }
})();

function profileKey(base) {
  return activeProfileId === 'default' ? base : `${base}_profile_${activeProfileId}`;
}

// 账本工作台：只保留自定义工作台，默认名称为工作台1、工作台2……，可随时改名。
const WORKBENCH_KEY = 'settlement_workbenches_v1';
function readWorkbenchList() {
  let list = [];
  try { const raw = workspaceStorage.getItem(WORKBENCH_KEY); if (raw) list = JSON.parse(raw); } catch(_) {}
  list = Array.isArray(list) ? list.filter(x => x && x.id && x.name).map(x => ({ id: String(x.id), name: String(x.name) })) : [];
  if (!list.length) {
    list = [{ id: 'default', name: '工作台1' }];
    // 迁移旧版“上班工作 / 外包兼职”中已有数据的账本，只保留数据，不再显示旧名称。
    try {
      if (workspaceStorage.getItem('settlement_v1_profile_job')) list.push({ id: 'job', name: '工作台2' });
      if (workspaceStorage.getItem('settlement_v1_profile_freelance')) list.push({ id: 'freelance', name: '工作台' + (list.length + 1) });
    } catch(_) {}
    writeWorkbenchList(list);
  }
  if (!list.some(x => x.id === 'default')) list.unshift({ id: 'default', name: '工作台1' });
  if (!list.some(x => x.id === activeProfileId)) list.push({ id: activeProfileId, name: '工作台' + (list.length + 1) });
  const names = new Set();
  return list.map((x, i) => {
    let name = x.name.trim() || ('工作台' + (i + 1));
    while (names.has(name)) name = name + '·' + (i + 1);
    names.add(name);
    return { id: x.id, name };
  });
}
function writeWorkbenchList(list) {
  try { workspaceStorage.setItem(WORKBENCH_KEY, JSON.stringify(list)); } catch(_) {}
}
let workbenchList = readWorkbenchList();
function workbenchName(id) {
  const item = workbenchList.find(x => x.id === id);
  return item ? item.name : '工作台';
}
function nextWorkbenchName(list=workbenchList) {
  let n = list.length + 1;
  const used = new Set(list.map(x => x.name));
  while (used.has('工作台' + n)) n++;
  return '工作台' + n;
}
function syncWorkbenchSelect() {
  const select = document.getElementById('workspaceProfileSelect');
  if (!select) return;
  select.innerHTML = workbenchList.map(x => `<option value="${attrStr(x.id)}">${esc(x.name)}</option>`).join('') + '<option value="__add__">＋ 添加工作台</option>';
  select.value = activeProfileId;
}
function onWorkbenchSelect(value) {
  if (value === '__add__') {
    syncWorkbenchSelect();
    addWorkbench();
    return;
  }
  switchWorkspaceProfile(value);
}
function addWorkbench() {
  const name = nextWorkbenchName();
  openModal(`<h2>添加工作台</h2><p class="review-hint">新工作台从空白账本开始，名称可随时修改。</p><div class="form-row"><label>名称</label><input id="newWorkbenchName" value="${attrStr(name)}" maxlength="20" onkeydown="if(event.key==='Enter'){event.preventDefault();confirmAddWorkbench();}"></div><div class="modal-actions"><button class="btn" onclick="confirmAddWorkbench()">创建</button><button class="btn secondary" onclick="closeModal()">取消</button></div>`);
  setTimeout(() => { const input = document.getElementById('newWorkbenchName'); if (input) { input.focus(); input.select(); } }, 30);
}
function confirmAddWorkbench() {
  const input = document.getElementById('newWorkbenchName');
  const name = (input ? input.value : '').trim();
  if (!name) return toast('请填写工作台名称');
  if (workbenchList.some(x => x.name === name)) return toast('已有同名工作台，请换一个名称');
  const id = 'workbench-' + Date.now().toString(36);
  workbenchList.push({ id, name });
  writeWorkbenchList(workbenchList);
  closeModal();
  switchWorkspaceProfile(id);
  syncWorkbenchSelect();
}
function renameWorkbench() {
  const name = workbenchName(activeProfileId);
  openModal(`<h2>修改工作台名称</h2><div class="form-row"><label>名称</label><input id="renameWorkbenchName" value="${attrStr(name)}" maxlength="20" onkeydown="if(event.key==='Enter'){event.preventDefault();confirmRenameWorkbench();}"></div><div class="modal-actions"><button class="btn" onclick="confirmRenameWorkbench()">保存</button><button class="btn secondary" onclick="closeModal()">取消</button></div>`);
  setTimeout(() => { const input = document.getElementById('renameWorkbenchName'); if (input) { input.focus(); input.select(); } }, 30);
}
function confirmRenameWorkbench() {
  const input = document.getElementById('renameWorkbenchName');
  const name = (input ? input.value : '').trim();
  if (!name) return toast('请填写工作台名称');
  if (workbenchList.some(x => x.id !== activeProfileId && x.name === name)) return toast('已有同名工作台，请换一个名称');
  const item = workbenchList.find(x => x.id === activeProfileId);
  if (item) item.name = name; else workbenchList.push({ id: activeProfileId, name });
  writeWorkbenchList(workbenchList);
  syncWorkbenchSelect();
  closeModal();
  toast('已改名为「' + name + '」');
}

const STORE_KEY = 'settlement_v1';
const dataRepository = {
  readCurrent: () => {
    const k = profileKey(STORE_KEY);
    return workspaceStorage.getItem(k);
  },
  writeCurrent: raw => {
    const k = profileKey(STORE_KEY);
    workspaceStorage.setItem(k, raw);
  },
  deleteCurrent: () => {
    const k = profileKey(STORE_KEY);
    workspaceStorage.removeItem(k);
  },
  readRecovery: () => {
    const k = profileKey('settlement_recovery_v2');
    return workspaceStorage.getItem(k);
  },
  writeRecovery: raw => {
    const k = profileKey('settlement_recovery_v2');
    workspaceStorage.setItem(k, raw);
  }
};

function switchWorkspaceProfile(id) {
  if (id === activeProfileId) return;
  activeProfileId = id;
  try { workspaceStorage.setItem('settlement_active_profile', id); } catch(_) {}
  // 撤销栈绑定账本；跨账本撤销会把旧账本整本写进新账本。
  dataUndoStack.length = 0;
  updateDataUndoUI();
  closeModal();
  pendingBackup = null;
  clearRecordSelection();
  state.collapsed = {};
  state.selectedDate = null;
  state.calYear = null;
  state.calMonth = null;
  loadData();
  render();
  syncWorkbenchSelect();
  toast(`已切换至「${workbenchName(id)}」账本`);
}
let workspaceBootError = window.desktopWorkspace?.error || null;
// 先恢复中断写入并保全旧版本，再允许现有初始化迁移设置。
try { if(workspaceBootError)throw new Error(workspaceBootError); SettlementWorkspace.recoverInterrupted(workspaceStorage); SettlementWorkspace.createUpgradeSnapshot(workspaceStorage,APP_VERSION); }
catch(error) { workspaceBootError=error; setTimeout(()=>toast('更新前备份或恢复未完成，当前暂停保存；请下载备份并检查存储空间'),250); }


const DEFAULT_DATA = window.SETTLEMENT_DEMO_FIXTURE;

let state = { cycle: 'natural', data: null, collapsed: {}, calYear: null, calMonth: null, selectedDate: null };

function loadData() {
  let raw = null;
  try {
    raw = dataRepository.readCurrent();
    if (raw) {
      const parsed=JSON.parse(raw),checked=validateBackup(parsed);
      if(!checked.ok) { document.getElementById('toast').textContent='现有数据异常，请先备份并检查'; throw Error(checked.error); }
      state.data=checked.data;
      if(!workspaceBootError&&JSON.stringify(parsed)!==JSON.stringify(checked.data)){
        try{SettlementWorkspace.writeBundle(workspaceStorage,{businessRaw:JSON.stringify(checked.data)});}
        catch(error){if(error.rollbackFailed)workspaceBootError=error;throw error;}
      }
      return;
    }
  } catch(e) { state.dataBlocked=true; state.blockedRaw=raw; state.data=normalizeData(DEFAULT_DATA); setTimeout(()=>toast(raw===null?'无法读取本地数据，当前为只读示例；请检查存储权限':'现有数据异常，当前为只读示例；备份将保留原文'),200); return; }
  // 新建工作台从空白账本开始；默认工作台首次运行仍保留示例数据。
  state.data = activeProfileId === 'default' ? normalizeData(DEFAULT_DATA) : normalizeData({ ...DEFAULT_DATA, projects: [] });
  if (activeProfileId === 'default') for (const p of state.data.projects) p.mode = '按集';
  if(!workspaceBootError)saveData();
}
function saveData() {
  if(workspaceBootError)return false;
  try { dataRepository.writeCurrent(JSON.stringify(state.data)); return true; }
  catch(error) { state.dataBlocked=true; state.blockedRaw=null; setTimeout(()=>toast('本地保存失败，当前为只读示例，请检查存储空间与权限'),200); return false; }
}

// ═══════════════════════════════════════════════════════
// 计算工具
// ═══════════════════════════════════════════════════════
function t2sec(t) {
  const [h,m,s] = t.split(':').map(Number);
  return h*3600 + m*60 + s;
}
function sec2t(sec) {
  const s = Math.round(sec);
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const rem = s % 60;
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(rem).padStart(2,'0')}`;
}
// 直接读 WAV 文件头算时长，不解码整个音频
async function readWavDuration(file) {
  const buf = await file.slice(0, 2000).arrayBuffer();
  const dv = new DataView(buf);
  if (dv.getUint32(0, false) !== 0x52494646) throw new Error('not RIFF');
  let offset = 12;
  let sampleRate = 0, bitsPerSample = 0, channels = 0, dataSize = 0;
  while (offset + 8 <= dv.byteLength) {
    const fc = String.fromCharCode(dv.getUint8(offset),dv.getUint8(offset+1),dv.getUint8(offset+2),dv.getUint8(offset+3));
    const cs = dv.getUint32(offset+4, true);
    if (fc === 'fmt ') {
      channels = dv.getUint16(offset+10, true);
      sampleRate = dv.getUint32(offset+12, true);
      bitsPerSample = dv.getUint16(offset+22, true);
    } else if (fc === 'data') {
      dataSize = cs;
      break;
    }
    offset += 8 + cs + (cs % 2);
  }
  if (!sampleRate || !dataSize) throw new Error('bad wav header');
  return dataSize / (sampleRate * channels * (bitsPerSample/8));
}

function sec2str(sec) {
  sec = Math.round(sec);
  const h = String(Math.floor(sec/3600)).padStart(2,'0');
  const m = String(Math.floor((sec%3600)/60)).padStart(2,'0');
  const s = String(sec%60).padStart(2,'0');
  return `${h}:${m}:${s}`;
}
// 只读取 MP4 的盒子头与影片时间字段；跳过 mdat，不加载整段视频。
async function readMp4Duration(file) {
  const size = file && file.size;
  if (!Number.isSafeInteger(size) || size < 8 || typeof file.slice !== 'function') {
    throw new Error('MP4 文件为空或大小无效');
  }
  let boxCount = 0;
  const maxBoxes = 10000;
  async function readBytes(start, length) {
    if (!Number.isSafeInteger(start) || start < 0 || start + length > size) {
      throw new Error('MP4 文件数据不完整');
    }
    const buffer = await file.slice(start, start + length).arrayBuffer();
    if (buffer.byteLength !== length) throw new Error('MP4 文件数据不完整');
    return new DataView(buffer);
  }
  function uint64(view, offset) {
    const value = view.getUint32(offset, false) * 4294967296 + view.getUint32(offset + 4, false);
    if (!Number.isSafeInteger(value)) throw new Error('MP4 数值超出安全读取范围');
    return value;
  }
  async function readBox(start, end) {
    if (++boxCount > maxBoxes) throw new Error('MP4 结构过于复杂');
    if (end - start < 8) throw new Error('MP4 盒子头不完整');
    const head = await readBytes(start, 8);
    const type = String.fromCharCode(...[4, 5, 6, 7].map(i => head.getUint8(i)));
    let length = head.getUint32(0, false);
    let headerSize = 8;
    if (length === 1) {
      if (end - start < 16) throw new Error('MP4 扩展盒子头不完整');
      length = uint64(await readBytes(start + 8, 8), 0);
      headerSize = 16;
    } else if (length === 0) {
      length = end - start;
    }
    if (length < headerSize || length > end - start) throw new Error('MP4 盒子大小无效或文件被截断');
    return { type, payload: start + headerSize, end: start + length };
  }
  async function readMovieHeader(box) {
    if (box.end - box.payload < 4) throw new Error('MP4 时间信息不完整');
    const version = (await readBytes(box.payload, 4)).getUint8(0);
    if (version !== 0 && version !== 1) throw new Error('MP4 时间信息版本不支持');
    const length = version === 1 ? 32 : 20;
    if (box.end - box.payload < length) throw new Error('MP4 时间信息被截断');
    const fields = await readBytes(box.payload, length);
    const timescale = fields.getUint32(version === 1 ? 20 : 12, false);
    const duration = version === 1 ? uint64(fields, 24) : fields.getUint32(16, false);
    // 全 1 表示未知时长；不将缺失信息当成零秒成果导入。
    if (!timescale || !duration || (version === 0 && duration === 0xffffffff)) {
      throw new Error('MP4 时长缺失或无效');
    }
    const seconds = duration / timescale;
    if (!Number.isFinite(seconds) || seconds <= 0) throw new Error('MP4 时长无效');
    return seconds;
  }
  for (let offset = 0; offset < size;) {
    const box = await readBox(offset, size);
    if (box.type === 'moov') {
      for (let childOffset = box.payload; childOffset < box.end;) {
        const child = await readBox(childOffset, box.end);
        if (child.type === 'mvhd') return await readMovieHeader(child);
        childOffset = child.end;
      }
    }
    offset = box.end;
  }
  throw new Error('MP4 未找到影片时长，文件可能不完整或为无时长的分片视频');
}

async function readMediaDuration(file) {
  const extension = String(file && file.name || '').split('.').pop().toLowerCase();
  let seconds;
  if (extension === 'wav') seconds = await readWavDuration(file);
  else if (['mp4', 'mov', 'm4a'].includes(extension)) seconds = await readMp4Duration(file);
  else throw new Error('仅支持 WAV 音频或 MP4/MOV/M4A 视频');
  if (!Number.isFinite(seconds) || seconds <= 0) throw new Error('媒体时长无效');
  return seconds;
}

function feeOf(proj, ep) { return SettlementBilling.fee(state.data.prices,proj,ep,state.data.premiumPrices); }
// 不计价原因只认计价核心的枚举，界面各处不再各判一套（修改/手动排除/标记不计价/旧版本/Demo旧版/成片替换）。
function exclusionText(ep){
  const key=SettlementBilling.exclusionReason(ep);
  if(!key)return '';
  // 手动排除 / 自动置零要说清「谁置的、为什么」（S2-2.2，D3 两者等权可覆盖）。
  if(key==='excluded'){
    const who=SettlementExclusion.label(ep)||'人工置零';
    return ep.excludeReason?who+'：'+ep.excludeReason:who;
  }
  return SettlementBilling.EXCLUSION_REASONS[key];
}
// 阶梯项目里区间没覆盖到的记录：按项目默认等级兜底计价（不再算 0），这里集中统计并在汇总行提示补区间。
function staircaseGapHint(){
  let count=0;const names=[];
  for(const p of state.data.projects){
    if(!SettlementBilling.usesStaircase(p,{type:p.type}))continue;
    let hit=0;
    for(const r of Object.values(p.episodes))if(SettlementBilling.unmatched(p,r))hit++;
    if(hit){count+=hit;names.push(p.name+' '+hit+'条（按'+SettlementBilling.fallbackLevel(p)+'级）');}
  }
  if(!count)return '';
  return ` ｜ ⚠ ${count}条超出阶梯区间，已按项目默认等级兜底计价（${names.slice(0,3).join('、')}${names.length>3?' 等':''}），建议补全区间`;
}
// 待定级：导入或手工登记时没定等级、项目也没有默认等级（S2-2.4 不再默认 C）。
// 这些记录计 0 元，但必须在汇总行说出来，避免「静默漏钱」。
function unratedHint(){
  let count=0;const names=[];
  for(const p of state.data.projects){
    let hit=0;
    for(const r of Object.values(p.episodes))if(SettlementBilling.needsGrade(p,r)&&SettlementBilling.isBillable(r))hit++;
    if(hit){count+=hit;names.push(p.name+' '+hit+'条');}
  }
  if(!count)return '';
  return ` ｜ ⚠ ${count}条待定级、按 0 计（${names.slice(0,3).join('、')}${names.length>3?' 等':''}），请到项目设置里定级`;
}

  if(versionTimelineCache)return versionTimelineCache;
  const map=new Map();
  for(const project of state.data.projects)map.set(project.id||project.name,SettlementVersion.buildTimeline(project));
  versionTimelineCache=map;return map;

  return info.delivery?e.workType:'修改';

function periodKey(dateStr) {
  // 未初始化时按自然月，避免启动期把半月口径写进记录（S2-2.7 period 要冻结）。
  const cycle = state.cycle || 'natural';
  const d = new Date(dateStr + 'T00:00:00');
  const y = d.getFullYear(), m = d.getMonth(), day = d.getDate();
  if (cycle === 'natural') return `${y}-${String(m+1).padStart(2,'0')}`;
  if (day <= 15) {
    const pm = m===0?11:m-1, py = m===0?y-1:y;
    return `${py}-${String(pm+1).padStart(2,'0')}下/${y}-${String(m+1).padStart(2,'0')}上`;
  } else {
    const nm = m===11?0:m+1, ny = m===11?y+1:y;
    return `${y}-${String(m+1).padStart(2,'0')}下/${ny}-${String(nm+1).padStart(2,'0')}上`;
  }
}
function periodLabel(key) {
 if(state.cycle==='natural'){const [y,m]=key.split('-');return `${y}年${Number(m)}月`;}
 const m=key.match(/^(\d{4})-(\d{2})下\/(\d{4})-(\d{2})上$/);
 return m?`${m[1]}年${Number(m[2])}月16日—${m[3]}年${Number(m[4])}月15日`:key;
}

// 结算期起止日期（D4：界面默认按自然月看，但导出一律写起止日期）。
// 期间名在记录里冻结（S2-2.7），所以改 cycle 设置不会改写历史期间。
function periodRange(key) {
 const pad=(n)=>String(n).padStart(2,'0');
 const lastDay=(y,m)=>new Date(y,m,0).getDate();
 const natural=key.match(/^(\d{4})-(\d{2})$/);
 if(natural){const y=Number(natural[1]),m=Number(natural[2]);return {start:y+'-'+pad(m)+'-01',end:y+'-'+pad(m)+'-'+pad(lastDay(y,m))};}
 const half=key.match(/^(\d{4})-(\d{2})下\/(\d{4})-(\d{2})上$/);
 if(half){return {start:half[1]+'-'+pad(Number(half[2]))+'-16',end:half[3]+'-'+pad(Number(half[4]))+'-15'};}
 const ymd=String(key||'');
 const ok=/^\d{4}-\d{2}-\d{2}$/.test(ymd);
 return {start:ok?ymd:'',end:ok?ymd:''};
}

  const periods = [...new Set([...list.map(e=>periodKey(e.date)),periodKey(localToday())])].sort().reverse();
  const sel = document.getElementById('monthFilter');
  const cur = state.pendingPeriod??sel.value;delete state.pendingPeriod;
  sel.innerHTML = '<option value="">全部结算期累计</option>';

    const opt = document.createElement('option');
    opt.value = p; opt.textContent = periodLabel(p);

// 连续集号压缩成范围：[1,3,5,6,7,9] → "1，3，5-7，9"
function compressEps(epNos) {
  const nums = Array.from(new Set(epNos.filter(x=>/^\d+$/.test(String(x))).map(Number))).sort((a,b)=>a-b);
  if (!nums.length) return epNos.length ? epNos.length+'条独立记录' : '';
  const parts = [];
  let s = nums[0], pv = nums[0];
  const flush = () => parts.push(s===pv ? String(s) : s + '-' + pv);
  for (let i=1;i<nums.length;i++){
    if (nums[i]===pv+1) pv = nums[i];
    else { flush(); s = pv = nums[i]; }
  }
  flush();
  return parts.join('，') + (epNos.filter(x=>!/^\d+$/.test(String(x))).length ? ' · '+epNos.filter(x=>!/^\d+$/.test(String(x))).length+'条独立记录' : '');
}

function loadColCfg() {
  try {
    const raw = workspaceStorage.getItem(COL_KEY);
    if (raw) {
      const c = JSON.parse(raw);
      const oldDefault=['epNo','proj','grade','type','work','billing','date','duration','min','mode','fee'],previous=['epNo','proj','grade','type','work','billing','date','duration','version','mode','fee'];if(JSON.stringify(c.order)===JSON.stringify(oldDefault)||JSON.stringify(c.order)===JSON.stringify(previous))c.order=EP_COLS.map(col=>col.key);
      const order = [...new Set((c.order || []).map(k=>k==='min'?'duration':k))].filter(k => EP_COLS.some(x => x.key === k));if((c.order||[]).includes('min')&&!c.hidden?.min&&c.hidden)c.hidden.duration=false;
      for (const col of EP_COLS) if (!order.includes(col.key)) order.push(col.key);

function defaultCalendarFilters(){return {workTypes:['混音','重混','修改'],types:['正式','Demo'],categories:['premium','automation']};}
// 旧版默认「仅混音」与新默认完全相同时按新默认迁移，用户自行改过的筛选保持不变。
function normalizeCalendarFilters(value){
  const defaults=defaultCalendarFilters();
  if(!value||typeof value!=='object')return defaults;
  const legacy=Array.isArray(value.workTypes)&&value.workTypes.length===1&&value.workTypes[0]==='混音'
    &&(!Array.isArray(value.types)||value.types.join()==='正式,Demo')
    &&(!Array.isArray(value.categories)||value.categories.join()==='premium,automation');
  if(legacy)return defaults;
  for(const [key,allowed] of Object.entries({workTypes:['混音','重混','修改'],types:['正式','Demo'],categories:['premium','automation']}))
    if(Array.isArray(value[key])&&value[key].every(x=>allowed.includes(x)))defaults[key]=[...new Set(value[key])];
  return defaults;
}
function calendarMatches(e){const f=normalizeCalendarFilters(settings.calendarFilters);return f.workTypes.includes(displayWorkType(e))&&f.types.includes(e.type)&&f.categories.includes(uiCategory(e.proj));}
function calendarMixOnly(){const f=normalizeCalendarFilters(settings.calendarFilters);return f.workTypes.length===1&&f.workTypes[0]==='混音';}
function openCalendarFilters(){const f=normalizeCalendarFilters(settings.calendarFilters),groups=[['workTypes','工作类型',[['混音','混音'],['修改','修改'],['重混','重混']]],['types','作品用途',[['正式','正式'],['Demo','Demo']]],['categories','制作类别',[['premium','精品剧'],['automation','自动化']]]];openModal(`<h2>日历筛选</h2><p class="review-hint">同组多选可同时显示，不同组同时满足。这里只筛选日历内容，不改账目或全局金额；Demo混音默认可见。</p>${groups.map(([key,label,values])=>`<fieldset class="calendar-filter-group"><legend>${label}</legend>${values.map(([value,text])=>`<label><input type="checkbox" data-calendar-filter="${key}" value="${value}" ${f[key].includes(value)?'checked':''}>${text}</label>`).join('')}</fieldset>`).join('')}<p id="calendarFilterError" role="alert"></p><div class="modal-actions"><button class="btn secondary" onclick="document.querySelectorAll('[data-calendar-filter]').forEach(x=>x.checked=true)">全部</button><button class="btn secondary" onclick="document.querySelectorAll('[data-calendar-filter]').forEach(x=>x.checked=x.dataset.calendarFilter!=='workTypes'||x.value==='混音')">默认混音</button><button class="btn" onclick="saveCalendarFilters()">应用筛选</button><button class="btn secondary" onclick="closeModal()">取消</button></div>`);}

function renderCalendar(list, box, showDetails=true) {
  // 按日分组
  const byDay = {};
  for (const e of list) {
    if (!byDay[e.date]) byDay[e.date] = [];
    byDay[e.date].push(e);
  }
  // 默认显示最新有数据的月，并选中最新一天
  const scope=calendarScopeKey();
  if (!state.calYear || state.calendarScope!==scope) {
    state.calendarScope=scope;
    const dates = Object.keys(byDay).sort();
    const latest = dates[dates.length-1] || localToday();
    const d = new Date(latest + 'T00:00:00');
    state.calYear = d.getFullYear();
    state.calMonth = d.getMonth();
    state.selectedDate = null;
  }
  const y = state.calYear, m = state.calMonth;
  const today = localToday();

  let html = '<div class="cal-nav">';
  html += `<button onclick="calNav(-1)">‹ 上月</button>`;
  html += `<span class="cal-title">${y}年${m+1}月</span>`;
  html += `<button onclick="calNav(1)">下月 ›</button>`;

  html += '</div>';
  const dowNames = settings.weekStart === 'sun'
    ? ['日','一','二','三','四','五','六']
    : ['一','二','三','四','五','六','日'];
  html += '<div class="cal-dow-header">' + dowNames.map(d => `<span>${d}</span>`).join('') + '</div>';
  html += '<div class="cal-grid">';

  const firstDay = new Date(y, m, 1);
  // 周一起始
  let startOffset = settings.weekStart === 'sun' ? firstDay.getDay() : (firstDay.getDay() + 6) % 7;
  const daysInMonth = new Date(y, m+1, 0).getDate();
  for (let i=0; i<startOffset; i++) html += '<div class="cal-cell empty"></div>';
  for (let d=1; d<=daysInMonth; d++) {
    const ds = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const dayEps = byDay[ds] || [];
    const n = dayEps.length;
    const mixes=dayEps.filter(calendarMatches);
    const calendarPrefix=calendarMixOnly()?'混音':'显示';
    const fee = mixes.reduce((s,e)=>s+e.fee,0);
    const cls = ['cal-cell'];
    if (!n) cls.push('empty');
    if (ds === today) cls.push('today');
    if (ds === state.selectedDate) cls.push('selected');
    html += `<div class="${cls.join(' ')}" data-date="${ds}" role="button" tabindex="0" aria-label="${ds}，${calendarPrefix}${mixes.length}条，其他工作${n-mixes.length}条，Ctrl加左键、停留或聚焦查看当日信息" onmouseenter="queueCalendarDetails(this,'${ds}')" onmouseleave="closeCalendarDetails()" onfocus="queueCalendarDetails(this,'${ds}')" onblur="closeCalendarDetails()" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();(event.ctrlKey?clickCalendarDay:selectDay)('${ds}')}" onclick="(event.ctrlKey?clickCalendarDay:selectDay)('${ds}')">`;
    html += `<div class="dow">${d}</div>`;
    if (n) {
      // 按显示分类分组：日历窗格默认不渲染「修改」，保持窗格整洁；修改只在详情卡展示。
      const groups=new Map();
      for (const x of mixes) {
        const kind=displayWorkType(x);
        if(kind==='修改')continue;
        const label=x.proj.name+(x.type==='Demo'?' · Demo':'');
        const gkey=label+'|'+kind;
        if(!groups.has(gkey))groups.set(gkey,{label,kind,items:[]});
        groups.get(gkey).items.push(x);
      }
      const lines=[...groups.values()].map(g=>{
        const nums=g.items.map(x=>episodeNumberOf(x)).filter(v=>v!==null);
        const others=g.items.length-nums.length;
        let content;
        if(g.kind==='混音')content=nums.length?compressEps(nums)+(others?' · '+others+'条独立记录':''):g.items.length+'条独立记录';
        else content=g.items.length+'条重混';
        return {text:g.label+'：'+content,kind:g.kind};
      });
      html += `<div class="eplist">${lines.map(l=>`<span class="cal-line cal-line-${l.kind==='混音'?'mix':'remix'}">${esc(l.text)}</span>`).join('<br>')}</div>`;
      html += `<div class="cellfoot"><span class="count">${calendarPrefix}${mixes.length}条</span><span class="fee amt">¥${fee.toFixed(0)}</span></div>`;
    }
    html += '</div>';
  }
  html += '</div>';

  if(!showDetails){box.innerHTML=html;return;}
  // 选中日明细
  if (state.selectedDate && byDay[state.selectedDate]) {
    const eps = byDay[state.selectedDate];
    const sec = eps.reduce((s,e)=>s+e.sec,0);
    const fee = eps.reduce((s,e)=>s+e.fee,0);
    const wd = ['日','一','二','三','四','五','六'][new Date(state.selectedDate+'T00:00:00').getDay()];
    html += `<h3 style="margin:10px 0;color:var(--main)">${state.selectedDate} 周${wd} · ${eps.length}集 / ${(sec/60).toFixed(1)}分 / <span class="amt">¥${fee.toFixed(2)}</span></h3>`;
    const ccols = visibleCols(true);
    html += `<table>${epColgroup(ccols)}`;
    html += '<thead><tr><th></th><th>#</th>' + ccols.map(k => `<th>${colLabel(k)}</th>`).join('') + '<th>操作</th></tr></thead><tbody>';
    eps.forEach((e,i) => {
      html += `<tr>` + leadCellHtml(e) +
        `<td class="record-number">${esc(displayRecordNumber(e,i))}</td>` + ccols.map(k => epCellHtml(e,k)).join('') + actionCellHtml(e) + `</tr>`;
    });
    html += '</tbody></table>';
  } else if (state.selectedDate) {
    html += `<p style="padding:16px;color:var(--muted)">${state.selectedDate} 无工作记录</p>`;
  }
  box.innerHTML = html;
}

let calendarHoverTimer=null,calendarCloseTimer=null,calendarHoverAnchor=null,calendarDetailsPinned=false;

function closeCalendarDetails(immediate=false){
 if(calendarDetailsPinned&&!immediate)return;

 const dismiss=()=>{const tip=document.getElementById('calendarHover');if(tip)tip.hidden=true;if(calendarHoverAnchor)calendarHoverAnchor.removeAttribute('aria-describedby');calendarHoverAnchor=null;};
 if(immediate)dismiss();else calendarCloseTimer=setTimeout(dismiss,140);
}
function calendarWorkGroups(list,type){
  const rows=list.filter(e=>displayWorkType(e)===type),groups=new Map();
  for(const e of rows){const name=(e.type==='Demo'?demoWorkName(e.proj,e.proj.episodes[e.epNo]):e.proj.name)+(e.type==='Demo'?' · Demo':'');if(!groups.has(name))groups.set(name,[]);groups.get(name).push(e);}
  return `<section class="calendar-work-group" data-work="${type}"><h4 class="${workTypeClass(type)}">${type} · ${rows.length}条</h4>${rows.length?[...groups].map(([name,items])=>{
    const ids=items.map(e=>episodeNumberOf(e)).filter(v=>v!==null);
    const versions=[...new Set(items.map(e=>(versionInfoOf(e)||{}).label).filter(Boolean))];
    const body=items[0].type==='Demo'
      ?[...new Set(items.map(e=>{const r=recordDemoRevision(e.proj,e.proj.episodes[e.epNo]);return '第'+r.take+'版 / V'+String(r.version).padStart(2,'0');}))].join('，')
      :(ids.length?compressEps(ids):items.length+'条独立记录')+(versions.length?'（'+versions.join('、')+'）':'');
    return `<div class="calendar-work-card"><span>${esc(name)}</span><b class="${workTypeClass(type)}">${esc(body)}</b></div>`;

}

// 成片校准与最终结算（v2.8.1 阶段 2B）
// 2026-11-04 裁决：成片数据并入账本；导入即刻重算；成片记录占原 EP 行位且唯一计价；
// 原混音保留为参考（finalCutSuperseded）不计价；三类工作类型不变，成片用 priceBasis + 备注「成片」表达。
// ═══════════════════════════════════════════════════════
const FINALCUT_LEGACY_KEY = 'settlement_finalcut_v1'; // 仅用于旧版独立数据一次性迁移
const FINALCUT_PREFIX = 'fc:';
function finalCutKey(epNo){return FINALCUT_PREFIX+String(Number(epNo));}
function finalCutIsKey(key){return String(key).startsWith(FINALCUT_PREFIX);}
function finalCutStore(){
 if(!state||!state.data)return [];
 if(!Array.isArray(state.data.finalCuts)){
  let legacy=[];
  try{
   const raw=localStorage.getItem(FINALCUT_LEGACY_KEY),list=raw?JSON.parse(raw):[];
   if(Array.isArray(list))legacy=list.filter(p=>p&&p.name&&Array.isArray(p.files)).map(p=>({
    name:String(p.name),updatedAt:p.updatedAt||0,
    files:p.files.filter(x=>x&&x.epNo).map(x=>({epNo:String(Number(x.epNo)),duration:String(x.duration||'00:00:00'),sec:Number(x.sec)||0,fileName:String(x.fileName||''),importedAt:new Date(p.updatedAt||Date.now()).toISOString(),reviewStatus:'待核对'}))
   }));
  }catch(_){}
  state.data.finalCuts=legacy;
 }
 return state.data.finalCuts;
}
function finalCutSelectedName(){return document.getElementById('finalCutProjectSelect')?.value||finalCutStore()[0]?.name||'';}
function finalCutMatchProject(name){return (state.data.projects||[]).find(p=>p.name===name)||null;}
function finalCutEpFromName(name){
 const base=String(name||'');
 const m=base.match(/\bEP\s*0*(\d{1,3})\b/i)||base.match(/第\s*0*(\d{1,3})\s*集/)||base.match(/(?:^|[^0-9])0*(\d{1,3})(?:[^0-9]|$)/);
 return m?String(Number(m[1])):null;
}
const FINALCUT_GENERIC_FOLDER = /^(交付|交付文件|成片|成片文件|正片|final|finals|out|output|导出|汇总)$/i;
function finalCutProjectFromFolder(rootName,trail,fallbackName){
 const folders=(trail||[]).filter(Boolean).filter(x=>x!==rootName);
 if(!rootName&&!folders.length)return fallbackName||'未命名成片';
 let name=folders.length?folders[folders.length-1]:rootName;
 if(FINALCUT_GENERIC_FOLDER.test(name)&&folders.length>1)name=folders[folders.length-2];
 if(!name||FINALCUT_GENERIC_FOLDER.test(name))name=rootName||fallbackName;
 return name||'未命名成片';
}
function upsertFinalCutList(store,projectName,files){
 let project=store.find(p=>p.name===projectName);
 if(!project){project={name:projectName,files:[],updatedAt:Date.now()};store.push(project);}
 for(const item of files){
  const epNo=String(Number(item.epNo));
  const idx=project.files.findIndex(x=>String(x.epNo)===epNo);
  const row={epNo,duration:item.duration,sec:item.sec,fileName:item.fileName,importedAt:item.importedAt||new Date().toISOString(),reviewStatus:'待核对'};
  if(idx>=0){if(project.files[idx].reviewStatus)row.reviewStatus=project.files[idx].reviewStatus;project.files[idx]=row;}
  else project.files.push(row);
 }
 project.files.sort((a,b)=>Number(a.epNo)-Number(b.epNo));
 project.updatedAt=Date.now();
}
function findOriginalEpisode(p,epNo){
 const entries=Object.entries(p.episodes||{}).filter(([k])=>!finalCutIsKey(k));
 return entries.find(([k])=>/^\d+$/.test(k)&&String(Number(k))===String(Number(epNo)))
   ||entries.find(([,r])=>String(r.episodeNo||'')===String(Number(epNo)))
   ||null;
}
// 把成片写入账本：原记录保留为参考，成片记录占原行位并唯一计价。
function buildFinalCutLedger(next,projectName,files){
 const p=next.projects.find(x=>x.name===projectName);
 if(!p)return 0;
 let count=0;
 for(const item of files){
  const epNo=String(Number(item.epNo));
  const entry=findOriginalEpisode(p,epNo);
  if(!entry)continue;
  const orig=entry[1],key=finalCutKey(epNo),prev=p.episodes[key];
  if(orig.finalCutOriginalExcluded===undefined){
   orig.finalCutOriginalExcluded=!!orig.excluded;
   orig.finalCutOriginalExcludeReason=orig.excludeReason||'';
  }
  const originalDuration=prev?.finalCut?.originalDuration||orig.duration;
  const originalSourceFile=prev?.finalCut?.originalSourceFile||orig.sourceFile||orig.sourcePath||'';
  orig.finalCutSuperseded=true;
  SettlementExclusion.setAuto(orig,true,'参考·已被成片替换');
  orig.note='参考·已被成片替换';
  p.episodes[key]={
   date:orig.date,duration:item.duration,episodeNo:epNo,label:'EP'+Number(epNo),
   workType:orig.workType||'混音',type:orig.type||p.type,grade:orig.grade||p.grade,mode:orig.mode||p.mode,
   excluded:false,priceBasis:'finalcut',note:'成片',
   finalCut:{fileName:item.fileName,importedAt:item.importedAt||new Date().toISOString(),originalDuration,originalSourceFile,reviewStatus:prev?.finalCut?.reviewStatus||'待核对'}
  };
  count++;
 }
 return count;
}
function restoreOriginalEpisode(p,epNo){
 delete p.episodes[finalCutKey(epNo)];
 const entry=findOriginalEpisode(p,epNo);
 if(!entry)return;
 const r=entry[1];
 if(!r.finalCutSuperseded)return;
 delete r.finalCutSuperseded;delete r.note;
 SettlementExclusion.setManual(r,!!r.finalCutOriginalExcluded,r.finalCutOriginalExcluded?(r.finalCutOriginalExcludeReason||'成片替换前已排除'):'');
 delete r.finalCutOriginalExcluded;delete r.finalCutOriginalExcludeReason;
}
async function finalCutReadDir(entry,rootName,trail,out){
 if(entry.isFile){await new Promise(resolve=>entry.file(file=>{out.push({file,rootName,trail:trail.slice()});resolve();},()=>resolve()));return;}
 if(!entry.isDirectory)return;
 const reader=entry.createReader(),readAll=()=>new Promise(resolve=>reader.readEntries(resolve,()=>resolve([])));
 let batch;
 do{batch=await readAll();for(const child of batch)await finalCutReadDir(child,rootName,trail.concat(entry.name),out);}while(batch.length);
}
// 导入即写账本并即时重算，不再需要手动「应用此时长」。
async function finalCutImportEntries(entries,fallbackName){
 if(!entries.length)return toast('没有找到可导入的成片文件');
 const groups=new Map();let failed=0;
 for(const item of entries){
  const epNo=finalCutEpFromName(item.file.name);
  if(!epNo){failed++;continue;}
  let sec=0;
  try{sec=await readMediaDuration(item.file);}
  catch(err){console.warn('读取时长失败',item.file.name,err);failed++;continue;}
  const projectName=finalCutProjectFromFolder(item.rootName,item.trail,fallbackName);
  if(!groups.has(projectName))groups.set(projectName,[]);
  groups.get(projectName).push({epNo,duration:sec2t(sec),sec,fileName:item.file.name,importedAt:new Date().toISOString()});
 }
 if(!groups.size)return toast(`未解析到可用成片${failed?'（'+failed+' 个文件读取失败或没有集数）':''}`);
 const next=normalizeData(state.data);
 next.finalCuts=Array.isArray(next.finalCuts)?next.finalCuts:finalCutStore().map(p=>({...p,files:[...p.files]}));
 let applied=0;const unmatched=[];
 for(const [name,files] of groups){
  upsertFinalCutList(next.finalCuts,name,files);
  const n=buildFinalCutLedger(next,name,files);
  if(n)applied+=n;else unmatched.push(name);
 }
 if(!commitDataChange(next,'成片校准'))return;
 const count=[...groups.values()].reduce((s,f)=>s+f.length,0);
 renderFinalCut();
 toast(`已导入 ${count} 个成片 · ${groups.size} 个项目；${applied} 集已按成片即时重算`+(unmatched.length?`；${unmatched.join('、')} 未匹配账本项目，仅暂存清单`:'')+(failed?`；${failed} 个跳过`:''));
}
async function finalCutHandleDrop(dt){
 if(!dt)return;
 const entries=[],items=Array.from(dt.items||[]);
 if(items.length&&items[0].webkitGetAsEntry){
  for(const item of items){const entry=item.webkitGetAsEntry();if(entry)await finalCutReadDir(entry,entry.name,[],entries);}
 }else for(const file of Array.from(dt.files||[]))entries.push({file,rootName:'',trail:[]});
 await finalCutImportEntries(entries,finalCutSelectedName()||'未命名成片');
}
async function handleFinalCutFolderInput(event){
 const files=Array.from(event.target.files||[]);
 const entries=files.map(file=>{const parts=String(file.webkitRelativePath||'').split('/').filter(Boolean);return {file,rootName:parts[0]||'',trail:parts.slice(0,-1)};});
 await finalCutImportEntries(entries,finalCutSelectedName()||'未命名成片');
 event.target.value='';
}
async function handleFinalCutFiles(event){
 const files=Array.from(event.target.files||[]);
 await finalCutImportEntries(files.map(file=>({file,rootName:'',trail:[]})),finalCutSelectedName()||'未命名成片');
 event.target.value='';
}
if(document.addEventListener){
 const finalCutDropTarget=e=>e.target&&e.target.closest&&e.target.closest('#view-finalCut');
 document.addEventListener('dragover',e=>{if(!finalCutDropTarget(e))return;e.preventDefault();e.stopPropagation();const zone=document.getElementById('finalCutDropZone');if(zone)zone.classList.add('over');},true);
 document.addEventListener('dragleave',e=>{if(!finalCutDropTarget(e))return;const zone=document.getElementById('finalCutDropZone');if(zone)zone.classList.remove('over');},true);
 document.addEventListener('drop',e=>{if(!finalCutDropTarget(e))return;e.preventDefault();e.stopPropagation();const zone=document.getElementById('finalCutDropZone');if(zone)zone.classList.remove('over');finalCutHandleDrop(e.dataTransfer);},true);
}
function finalCutStatusText(status){return status==='已核对'?'已核对':status==='已纠错'?'已纠错':'待核对';}
function renderFinalCut(){
 const box=document.getElementById('view-finalCut');
 if(!box)return;
 const store=finalCutStore(),selectedName=finalCutSelectedName();

function openModal(html) {
  detachGlassSettings();
  const box = document.getElementById('modalBox');
  box.style.transform='';
  box.innerHTML = html;
  document.getElementById('modalMask').classList.add('show');
  // 4.12：记住触发点，弹窗关闭后把焦点还回去
  modalReturnFocus = document.activeElement instanceof HTMLElement ? document.activeElement : null;
  box.setAttribute('tabindex','-1');
  const focusables = modalFocusables();
  (focusables[0] || box).focus();
}
function closeModal() {
  detachGlassSettings();
  document.getElementById('modalMask').classList.remove('show');
  // 4.12：关闭后焦点回到打开它的按钮，键盘用户不会掉到页面开头
  const back = modalReturnFocus;
  modalReturnFocus = null;
  if (back && back.isConnected) { try { back.focus(); } catch (e) {} }
}
let modalReturnFocus = null;
function modalFocusables() {
  const box = document.getElementById('modalBox');
  if (!box) return [];
  return [...box.querySelectorAll('button,input,select,textarea,a[href],[tabindex]:not([tabindex="-1"])')]
    .filter(el => !el.disabled && el.getClientRects().length > 0);
}
document.getElementById('modalMask').addEventListener('keydown', e => {
  if (e.key === 'Escape') { e.stopPropagation(); closeModal(); return; }
  if (e.key !== 'Tab') return;
  const items = modalFocusables();
  if (!items.length) return;
  const first = items[0], last = items[items.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
});
/* 4.12 全局快捷键：F2 登记、Ctrl+F 搜索、Esc 关弹窗 */
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && document.getElementById('modalMask').classList.contains('show')) {
    closeModal();
    return;
  }
  if (e.key === 'F2' && !e.ctrlKey && !e.altKey && !e.metaKey) {
    e.preventDefault();
    if (!document.getElementById('modalMask').classList.contains('show')) openRecordActions();
    return;
  }
  if ((e.ctrlKey || e.metaKey) && (e.key === 'f' || e.key === 'F')) {
    const input = document.getElementById('epFilter');
    if (!input) return;
    e.preventDefault();
    input.focus();
    if (typeof input.select === 'function') input.select();
  }
});
document.getElementById('modalMask').addEventListener('click', e => {
  if (e.target.id === 'modalMask') closeModal();
});

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2000);
}

// 桌面版（pywebview）里 Blob 下载不可靠 → 走原生保存对话框；网页版仍走 a[download]
// 延迟判定：pywebview 在页面加载后才注入 window.pywebview，脚本解析期取不到
function inApp() { return !!(window.pywebview && window.pywebview.api && window.pywebview.api.save_file); }
function blobToBase64(blob) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(String(r.result).split(',')[1]);
    r.onerror = rej;
    r.readAsDataURL(blob);
  });
}
async function downloadBlob(blob, name) {
  if (inApp()) {
    try {
      const p = await window.pywebview.api.save_file(name, await blobToBase64(blob));
      if (p) { toast('已保存：' + (p.length > 48 ? '…' + p.slice(-46) : p)); return; }
      return;                       // 用户取消保存对话框
    } catch (e) { console.warn('原生保存失败，回退浏览器下载', e); }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}

let xlsxLoader = null;
function ensureXlsx() {
  if (typeof XLSX !== 'undefined') return Promise.resolve(true);

    const script = document.createElement('script');
    script.src = 'assets/xlsx.full.min.js';
    script.onload = () => resolve(typeof XLSX !== 'undefined');
    script.onerror = () => resolve(false);
    document.head.appendChild(script);
  });
  return xlsxLoader;
}

  }

// 工作记录与计价独立；历史多版本标记只进入待核对。
function esc(s) { return String(s ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function workTypeOf(ep) { return SettlementBilling.workType(ep); }
function isBillable(ep) { return SettlementBilling.isBillable(ep); }
function normalizeData(data) {
  const d = JSON.parse(JSON.stringify(data));
  d.schemaVersion = 3;
  d.premiumPrices=d.premiumPrices||SettlementBilling.defaultPremiumPrices();
  for (const p of d.projects) {
    p.aliases = p.aliases || [];
    for (const e of Object.values(p.episodes)) {
      if (!e.workType && e.rework) e.needsReview = true;
      e.workType = workTypeOf(e);
      e.excluded = !!e.excluded || e.billable === false;
      SettlementExclusion.normalize(e);   // 历史数据补 excludeSource（S2-2.2）
      // S2-2.7：结算期与显示编号第一次写入后就不再变（改口径设置也不会改写历史）。
      e.period=e.period||periodKey(e.date);
      if (e.workType === '修改') e.excludeReason = e.excludeReason || '修改不计价';
    }

function updateBatchImportGroup(i,key,value){

 if(key==='name'){const matched=state.data.projects.find(p=>p.name===value||p.aliases?.includes(value));if(matched){g.name=matched.name;g.billingCategory=uiCategory(matched);g.existingLegacy=!matched.billingCategory||matched.billingCategory==='legacy';g.grade=g.type==='Demo'&&g.billingCategory==='premium'?'A':matched.grade;g.gradeRanges=matched.gradeRanges||'';g.mode=matched.mode;}}

async function prepareMultiProjectPreview(){
 const x=window._multiImport,source=JSON.stringify(state.data),revision=x.revision||0;x.preview=null;
 const button=document.querySelector('#modalBox .modal-actions .btn:not(.secondary)');if(button)button.disabled=true;

  const groups=[],names=new Set();
  for(const raw of x.groups){
   if(raw.type==='Demo')throw Error('Demo请使用独立Demo批量导入入口；正式文件请单独选择');
   if(!raw.files.length)throw Error('项目“'+(raw.name||'未命名')+'”还没有音视频，请添加或移除此组');
   const name=raw.name.trim();if(!name)throw Error('请填写每组项目名');

   if(names.has(canonical))throw Error('多个分组指向同一个项目，请合并文件到同组：'+canonical);names.add(canonical);

   if(!validDate(config.date))throw Error(canonical+'默认日期无效');
   const rules=parseGradeRanges(config.gradeRanges||(config.billingCategory==='premium'?SettlementBilling.defaultRanges:''),raw.billingCategory==='automation'?['D']:['A','B','C']);

    const best=candidates.reduce((a,b)=>preferImportCandidate(b,a)>0?b:a),no=best.episodeNo||'';
    const row={key,candidates,selected:candidates.indexOf(best),...deliveryDateInfo(best,config),episodeNo:no,type:config.type,grade:config.billingCategory==='premium'?gradeForNumber(config,no):rules.find(r=>no&&Number(no)>=r.lo&&Number(no)<=r.hi)?.grade||config.grade,workType:'混音',excluded:false,excludeReason:''};
    const storageKey=importStorageKey(row,config);row.action=formalDefaultAction(row,config,existing);rows.push(row);
   }
   if(!rows.length)throw Error(canonical+'没有可读取记录，源文件未导入');

  }
  if(!groups.length)throw Error('没有项目');if(source!==JSON.stringify(state.data))throw Error('读取期间账目已变化，请重新预览');

function confirmMultiProjectImport(){
 try{
  const preview=window._multiImport?.preview;if(!preview||preview.source!==JSON.stringify(state.data))throw Error('账目已变化，请返回重新预览');
  const next=normalizeData(state.data);let count=0;

   if(!p){p={id:SettlementIdentity.newId('project'),name:g.config.name,aliases:[],billingCategory:g.config.billingCategory,grade:g.config.grade,gradeRanges:g.config.gradeRanges,type:'正式',mode:g.config.mode,path:'',episodes:{}};if(g.config.createdDate){if(!validDate(g.config.createdDate))throw Error('项目创建日期无效');p.createdDate=g.config.createdDate;}next.projects.push(p);}
   const seen=new Set();for(const r of selected){if(!validDate(r.date)||r.episodeNo&&!/^\d+$/.test(r.episodeNo)||!r.episodeNo&&r.type!=='Demo')throw Error('请检查项目'+p.name+'的集号和日期');if(!allowedGrades(p).includes(r.grade))throw Error(p.name+'等级无效');
    let key=importTargetKey(r,g.config,p);if(seen.has(key)&&r.action!=='append')throw Error(p.name+'预览中集号重复，请跳过或另存');seen.add(key);
    if(r.action==='add'&&p.episodes[key])throw Error(p.name+'记录已存在，请重新预览');if(r.action==='update'&&!p.episodes[key])throw Error(p.name+'更新目标已变化');
    if(r.action==='append'){const base=key+'@'+Date.now();key=base;let n=0;while(p.episodes[key])key=base+'-'+(++n);}
    const recordId=r.action==='update'?p.episodes[key].recordId:SettlementIdentity.newId('record');p.episodes[key]=SettlementRates.stamp(p,{...importRowRecord(r,g.config),recordId},next.prices,next.premiumPrices);count++;
   }
  }
  if(!count)throw Error('没有选入记录，未写入项目');
  if(commitDataChange(next,'多项目导入')){closeModal();toast('已导入'+count+'条，可一次撤销');}
 }catch(error){const el=document.getElementById('multiPreviewError');if(el)el.textContent=error.message;else toast(error.message);}
}

async function prepareImportPreview(reviewDuplicates=true) {
  const name=document.getElementById('im_proj').value.trim(),type=document.getElementById('im_type').value,date=document.getElementById('im_date').value;
  if(!name)return toast('请输入项目名');if(!validDate(date))return toast('请选择有效日期');
  if(type==='Demo'){openDemoImport(window._importScan.files||[]);for(const row of _demoImport.rows)row.name=name;renderDemoImport();return;}
  if(type!=='Demo'&&Object.values(window._importScan.parsed).some(x=>!x.episodeNo))return toast('有无集号文件，请选择Demo或分开导入');
  const existing=state.data.projects.find(p=>p.name===name||p.aliases?.includes(name));
  if(existing&&existing.billingCategory&&existing.billingCategory!=='legacy'&&existing.billingCategory!==document.getElementById('im_category').value)return toast('请先在项目计价方案中更改已有项目类别');
  const config={billingCategory:existing?(existing.billingCategory||'legacy'):document.getElementById('im_category').value,gradeRanges:document.getElementById('im_ranges').value.trim(),name:existing?.name||name,type,grade:document.getElementById('im_grade').value,mode:document.getElementById('im_mode').value,date,dateMode:document.getElementById('im_dateMode').value,createdDate:document.getElementById('im_created').value,...readWorkFields('im')};
  let rules;try{rules=parseGradeRanges(config.gradeRanges||(config.billingCategory==='premium'?SettlementBilling.defaultRanges:''),allowedGrades(config));}catch(e){return toast(e.message);}
  const rows=[];let failed=[];
  for(const [key,item]of Object.entries(window._importScan.parsed)){
    const candidates=[];
    for(const c of item.candidates){try{const sec=await readMediaDuration(c.file);candidates.push({...c,duration:sec2str(sec)});}catch(e){failed.push(c.file.name);}}
    if(!candidates.length)continue;
    const best=candidates.reduce((best,c)=>preferImportCandidate(c,best)>0?c:best);
    const dateInfo=deliveryDateInfo(best,config);
    rows.push({key,candidates,selected:candidates.indexOf(best),...dateInfo,episodeNo:best.episodeNo||'',type:config.type,grade:config.billingCategory==='premium'?gradeForNumber(config,best.episodeNo):rules.find(r=>best.episodeNo&&Number(best.episodeNo)>=r.lo&&Number(best.episodeNo)<=r.hi)?.grade||config.grade,workType:config.workType,excluded:config.excluded,excludeReason:config.excludeReason});

// JSON 备份恢复与项目管理；与主页面共享 normalizeData / commitDataChange。
const BACKUP_MAX_BYTES = 20 * 1024 * 1024;
const RECOVERY_BACKUP_KEY = 'settlement_recovery_v2';
let pendingBackup = null;
let pendingRenameMapping = null;

function validateBackup(input) {
  try {
    const object = v => !!v && typeof v === 'object' && !Array.isArray(v);
    const fail = msg => { throw new Error(msg); };
    const cleanString = (v, max = 2000) => typeof v === 'string' && v.length <= max;
    let nodes = 0;
    function inspect(v, depth = 0) {
      if (depth > 12 || ++nodes > 500000) fail('备份结构过深或记录过多');
      if (v && typeof v === 'object') for (const k of Object.keys(v)) {
        if (['__proto__', 'prototype', 'constructor'].includes(k)) fail('备份含危险字段：' + k);
        inspect(v[k], depth + 1);
      }
    }
    if (!object(input)) fail('备份根节点应为对象');
    inspect(input);
    const enveloped = Object.prototype.hasOwnProperty.call(input, 'formatVersion');
    if(enveloped && input.preferences!==undefined)SettlementWorkspace.validatePreferences(input.preferences);
    if (enveloped && input.formatVersion !== 2) fail('暂不支持此备份版本，请使用版本 2 或旧版原始数据');
    const data = enveloped ? input.data : input;
    let ledgerMap=null,workbenchMap=null;
    if(enveloped && input.ledgers!==undefined){
      if(!object(input.ledgers)) fail('账本集合无效');
      const ids=Object.keys(input.ledgers);
      if(ids.length>50) fail('账本数量超过支持范围');
      let ledgerBytes=0;
      ledgerMap={};
      for(const id of ids){
        if(!/^[A-Za-z0-9_-]{1,64}$/.test(id)) fail('账本编号无效');
        const raw=input.ledgers[id];
        if(typeof raw!=='string'||raw.length>BACKUP_MAX_BYTES) fail('账本「'+id+'」内容无效');
        ledgerBytes+=raw.length;
        if(ledgerBytes>BACKUP_MAX_BYTES*4) fail('备份账本总量过大');
        let parsed;
        try{parsed=JSON.parse(raw);}catch(_){fail('账本「'+id+'」不是有效 JSON');}
        const checked=validateBackup(parsed);
        if(!checked.ok) fail('账本「'+id+'」：'+checked.error);
        ledgerMap[id]=JSON.stringify(checked.data);
      }
      if(input.activeLedger!==undefined&&(typeof input.activeLedger!=='string'||!ledgerMap[input.activeLedger]))fail('当前账本标记无效');
      if(input.workbenches!==undefined){
        if(!Array.isArray(input.workbenches)||input.workbenches.length>50)fail('工作台清单无效');
        const seenIds=new Set();workbenchMap=[];
        for(const item of input.workbenches){
          if(!object(item)||typeof item.id!=='string'||!/^[A-Za-z0-9_-]{1,64}$/.test(item.id)||seenIds.has(item.id))fail('工作台编号无效');
          if(typeof item.name!=='string'||!item.name.trim()||item.name.length>40)fail('工作台名称无效');
          seenIds.add(item.id);workbenchMap.push({id:item.id,name:item.name.trim()});
        }
      }
    }
    if (!object(data) || !object(data.prices) || !Array.isArray(data.projects)) fail('缺少有效的单价或项目列表');
    if(data.schemaVersion!==undefined && ![1,2,3].includes(data.schemaVersion))fail('暂不支持此数据版本');
    if(data.importHistory!==undefined)SettlementImportHistory.validate(data.importHistory);
    if(data.finalCuts!==undefined&&!Array.isArray(data.finalCuts))fail('成片清单无效');
    if (data.projects.length > 10000) fail('项目数量超过支持范围');
    for (const g of ['A', 'B', 'C', 'D']) {
      const pr = data.prices[g];
      if (!object(pr)) fail('缺少 ' + g + ' 级单价');
      for (const key of ['per_min', 'per_ep']) if (typeof pr[key] !== 'number' || !Number.isFinite(pr[key]) || pr[key] < 0 || pr[key] > 100000000) fail(g + ' 级单价无效');
    }
    if(data.premiumPrices!==undefined){if(!object(data.premiumPrices)||Object.keys(data.premiumPrices).some(g=>!['A','B','C'].includes(g)))fail('精品剧只允许ABC单价');for(const g of ['A','B','C']){const pr=data.premiumPrices[g];if(!object(pr)||['per_min','per_ep'].some(k=>typeof pr[k]!=='number'||!Number.isFinite(pr[k])||pr[k]<0||pr[k]>100000000))fail('精品剧'+g+'单价无效');}}
    const names = new Set(), identities = new Map(), projectIds=new Set(), recordIds=new Set();
    let recordCount = 0;
    for (const p of data.projects) {
      if (!object(p) || !cleanString(p.name, 200) || !p.name.trim()) fail('项目名称不能为空或超过 200 字');
      if (p.name !== p.name.trim() || names.has(p.name)) fail('项目名称重复或含首尾空格：' + p.name);
      names.add(p.name);
      if(p.id!==undefined){if(typeof p.id!=='string'||!/^[A-Za-z0-9_-]{1,128}$/.test(p.id)||projectIds.has(p.id))fail('项目编号无效或重复：'+p.name);projectIds.add(p.id);}
      if(p.shortName!==undefined&&p.shortName!==''&&!/^\p{Script=Han}{2,4}$/u.test(p.shortName))fail(p.name+'：缩写必须为2–4个中文字符');
      if(p.createdDate!==undefined&&p.createdDate!==''&&(typeof p.createdDate!=='string'||!validDate(p.createdDate)))fail(p.name+'：项目创建日期无效');
      if(p.demoBucket!==undefined&&(typeof p.demoBucket!=='boolean'||p.demoBucket&&p.type!=='Demo'))fail(p.name+'：Demo容器无效');
      if(p.billingCategory!==undefined&&!['legacy','premium','automation'].includes(p.billingCategory))fail(p.name+'：制作类别无效');
      if(p.gradeRanges!==undefined){if(typeof p.gradeRanges!=='string'||p.gradeRanges.length>4000)fail(p.name+'：阶梯无效');parseGradeRanges(p.gradeRanges,allowedGrades(p));}
      if (!allowedGrades(p).includes(p.grade)) fail(p.name + '：等级无效');
      if (!['正式','Demo'].includes(p.type)) fail(p.name + '：项目类型无效');
      if (!['按集','按时长'].includes(p.mode)) fail(p.name + '：计价方式无效');
      if (p.path !== undefined && !cleanString(p.path, 4000)) fail(p.name + '：交付路径无效');
      if (p.aliases !== undefined && (!Array.isArray(p.aliases) || p.aliases.length > 100 || p.aliases.some(a => !cleanString(a,200) || !a.trim() || a !== a.trim()))) fail(p.name + '：项目别名无效');
      const local = new Set();
      for (const name of [p.name, ...(p.aliases || []), ...(p.shortName?[p.shortName]:[])]) {
        if (local.has(name)) continue;
        local.add(name);
        if (identities.has(name) && identities.get(name) !== p.name) fail('项目名称或别名重复：' + name);
        identities.set(name, p.name);
      }
      if (!object(p.episodes)) fail(p.name + '：集数记录应为对象，不能为数组');
      for (const [key,e] of Object.entries(p.episodes)) {
        if (++recordCount > 100000 || !key.trim() || key.length > 300 || !object(e)) fail(p.name + '：记录无效或数量过多');
        if(e.recordId!==undefined){if(typeof e.recordId!=='string'||!/^[A-Za-z0-9_-]{1,128}$/.test(e.recordId)||recordIds.has(e.recordId))fail('工作记录编号无效或重复');recordIds.add(e.recordId);}
        if (!/^\d{4}-\d{2}-\d{2}$/.test(e.date || '')) fail(p.name + ' / ' + key + '：日期无效');
        const dt = new Date(e.date + 'T00:00:00Z');
        if (!Number.isFinite(dt.getTime()) || dt.toISOString().slice(0,10) !== e.date) fail(p.name + ' / ' + key + '：日期不存在');
        if (typeof e.duration !== 'string' || !/^\d{2,4}:[0-5]\d:[0-5]\d$/.test(e.duration)) fail(p.name + ' / ' + key + '：时长应为 HH:MM:SS');
        if(e.dateSource!==undefined&&!['file-name','episode-folder','month-day-inferred-year','manual','default','legacy'].includes(e.dateSource))fail(p.name+'：日期来源无效');
        if (e.grade !== undefined && !allowedGrades(p).includes(e.grade)) fail(p.name + '：记录等级无效');
        if (e.mode !== undefined && !['按集','按时长'].includes(e.mode)) fail(p.name + '：记录计价方式无效');
        if (e.type !== undefined && !['正式','Demo'].includes(e.type)) fail(p.name + '：记录类型无效');
        if(e.workType==='首次制作')e.workType='混音';
        if (e.workType !== undefined && !['混音','重混','修改'].includes(e.workType)) fail(p.name + '：工作类型无效');
        if(e.demoRevision!==undefined&&(!object(e.demoRevision)||Object.keys(e.demoRevision).some(k=>!['take','version'].includes(k))||['take','version'].some(k=>!Number.isInteger(e.demoRevision[k])||e.demoRevision[k]<1||e.demoRevision[k]>9999)))fail(p.name+'：Demo版本无效');
        for(const field of ['demoWorkKey','demoFingerprint'])if(e[field]!==undefined&&!cleanString(e[field],4000))fail(p.name+'：Demo标识无效');
        for (const field of ['versionSuperseded','demoSuperseded','billable','rework','excluded','countInAssessment','needsReview','multiVersion','finalCutSuperseded','finalCutOriginalExcluded']) if (e[field] !== undefined && typeof e[field] !== 'boolean') fail(p.name + '：' + field + ' 应为布尔值');
        if (e.episodeNo !== undefined && e.episodeNo !== null && (typeof e.episodeNo !== 'string' || !/^\d+$/.test(e.episodeNo))) fail(p.name + '：集号无效');
        for (const field of ['excludeReason','sourceName','demoName','sourceFile','label','note','finalCutOriginalExcludeReason']) if (e[field] !== undefined && !cleanString(e[field],4000)) fail(p.name + '：' + field + ' 无效');
        if (e.priceBasis !== undefined && !['delivery','finalcut'].includes(e.priceBasis)) fail(p.name + '：结算依据无效');
        if (e.finalCut !== undefined && !object(e.finalCut)) fail(p.name + '：成片元数据无效');
      }
    }
    return {ok:true, data:normalizeData(JSON.parse(JSON.stringify(data))), meta:{preferences:enveloped&&input.preferences!==undefined?SettlementWorkspace.validatePreferences(input.preferences):null,formatVersion:enveloped ? 2 : 1, exportedAt:enveloped && typeof input.exportedAt === 'string' ? input.exportedAt : '', recordCount, ledgers:ledgerMap, workbenches:workbenchMap, activeLedger:enveloped&&typeof input.activeLedger==='string'?input.activeLedger:null}};
  } catch (error) { return {ok:false, error:error.message, data:null}; }
}

async function previewJSONFile(file) {
  if (!file) return;
  if (file.size > BACKUP_MAX_BYTES) return toast('备份不能超过 20 MB');
  try {
    const text = await file.text();
    if (text.length > BACKUP_MAX_BYTES) throw new Error('备份内容过大');
    const result = validateBackup(JSON.parse(text.replace(/^\uFEFF/,'')));
    if (!result.ok) throw new Error(result.error);
    pendingBackup = {data:result.data, meta:result.meta, name:file.name};
    renderBackupPreview();

function importJSON(event) {

function mergeProjectData(localData,incomingData,overwrite) {
  const next = normalizeData(localData);
  let conflicts=0, incoming=0;
  for (const src of incomingData.projects) {
    const sourceNames=new Set([src.name,...(src.aliases || [])]);
    const targets=next.projects.filter(p => p.id===src.id||[p.name,...(p.aliases || [])].some(name=>sourceNames.has(name)));
    if (targets.length>1) throw new Error('项目别名同时匹配多个现有项目：'+src.name+'；请先调整名称');
    let target = targets[0];
    if (!target) { next.projects.push(JSON.parse(JSON.stringify(src))); incoming += Object.keys(src.episodes).length; continue; }
    for (const [key,episode] of Object.entries(src.episodes)) {
      if (Object.prototype.hasOwnProperty.call(target.episodes,key)) { conflicts++; if (!overwrite) continue; }
      target.episodes[key] = {...JSON.parse(JSON.stringify(episode)),recordId:target.episodes[key]?.recordId||episode.recordId}; incoming++;
    }
  }
  // 合并保留当前单价与项目配置，避免恢复记录时同时改变全局金额口径。
  const checked = validateBackup(next);
  if (!checked.ok) throw new Error('合并失败：' + checked.error);
  return {data:checked.data, conflicts, incoming};
}
function localLedgerData(id){

function restoredWorkbenches(names,ids){
  if(!names.length&&!ids.length)return null;
  const list=workbenchList.map(x=>({...x}));
  for(const item of names)if(!list.some(x=>x.id===item.id))list.push({...item});
  for(const id of ids)if(!list.some(x=>x.id===id))list.push({id,name:nextWorkbenchName(list)});
  if(!list.some(x=>x.id===activeProfileId))list.push({id:activeProfileId,name:nextWorkbenchName(list)});
  return list;
}
function buildBackupRestore(mode='merge', overwrite=false) {
  if (!pendingBackup) throw new Error('请重新选择备份文件');
  if(state.dataBlocked && mode!=='replace')throw new Error('现有数据异常，请选择替换恢复；原始数据会先保留快照');
  const sourceLedgers=pendingBackup.meta.ledgers||{};
  const sourceNames=pendingBackup.meta.workbenches||[];
  const ledgers={};
  const workbenches=restoredWorkbenches(sourceNames,Object.keys(sourceLedgers));
  if (mode === 'replace') {
    for(const [id,raw] of Object.entries(sourceLedgers)) ledgers[id]=JSON.parse(raw);
    return {data:normalizeData(pendingBackup.data), conflicts:0, incoming:backupStats(pendingBackup.data).records, ledgers, workbenches};
  }
  const merged=mergeProjectData(state.data,pendingBackup.data,overwrite);
  for(const [id,raw] of Object.entries(sourceLedgers)){
    if(id===activeProfileId) continue;
    const incoming=JSON.parse(raw);
    const local=localLedgerData(id)||blankLedgerData();
    ledgers[id]=mergeProjectData(local,incoming,overwrite).data;
  }
  return {data:merged.data, conflicts:merged.conflicts, incoming:merged.incoming, ledgers, workbenches};
}

    const a=SettlementSyncCore.createClient({accountId:'demo-account',deviceId:'device-a',transport:ta,save:next=>{savedA=JSON.parse(JSON.stringify(next));}});

function projectRenamePlan(mapping) {
  if (!Array.isArray(mapping)) throw new Error('重命名映射无效');
  const next=normalizeData(state.data), seen=new Set();
  for (const row of mapping) {
    if (!row || typeof row.from!=='string' || typeof row.to!=='string') throw new Error('重命名映射无效');
    const to=row.to.trim();
    if (!to || to.length>200) throw new Error('新项目名称不能为空或超过 200 字');
    if (seen.has(row.from)) throw new Error('项目重复出现在映射中：'+row.from);
    seen.add(row.from);
    const p=next.projects.find(p=>p.name===row.from);
    if (!p) throw new Error('找不到项目：'+row.from);
    if(row.shortName!==undefined){
      const short=row.shortName.trim();if(short&&!/^\p{Script=Han}{2,4}$/u.test(short))throw new Error('项目缩写需为2–4个中文字符');
      if(p.shortName&&p.shortName!==short)p.aliases=[...new Set([...(p.aliases||[]),p.shortName])];p.shortName=short;
    }
    if(p.name!==to){p.aliases=[...new Set([...(p.aliases || []),p.name])].filter(a=>a!==to);p.name=to;}
  }
  const checked=validateBackup(next);
  if (!checked.ok) throw new Error(checked.error+'。请另换名称；项目管理不会自动合并项目。');
  return checked.data;
}
function applyProjectRenames(mapping) {

}

function suggestProjectShortName(name,length=4){

  if(chars.length<2)return '';if(chars.length<=length)return chars.join('');
  const first=Math.ceil(length/2);return chars.slice(0,first).join('')+chars.slice(-(length-first)).join('');
}

function matchesEpisodeFilter(e,query) {
  if(!query)return true;
  const raw=e.proj.episodes[e.epNo],no=raw.episodeNo || (/^\d+$/.test(e.epNo)?e.epNo:null);
  return query.split(/[,，;；]/).some(part=>{
    const token=part.trim();if(!token)return false;
    const m=token.match(/^(?:EP)?(\d+)(?:\s*[-~到]\s*(?:EP)?(\d+))?$/i);
    if(m)return no!==null&&Number(no)>=Number(m[1])&&Number(no)<=Number(m[2]||m[1]);
    return [e.label,e.proj.name,e.proj.shortName||'',...(e.proj.aliases||[]),e.type,e.proj.episodes[e.epNo]?.sourceFile||''].some(value=>value.toLowerCase().includes(token.toLowerCase()));
  });
}
